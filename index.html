
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Teteng Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111820;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:12px;gap:8px}
.panel{background:#101820dc;border:1px solid #ffffff26;border-radius:12px;padding:10px}
.brand{font-weight:900;font-size:18px;letter-spacing:1px}
.brand span{color:#ff5b35}
.small{font-size:11px;color:#b8c6d3;margin-top:4px}
.stats{display:flex;gap:5px;text-align:center}
.stat strong{display:block;font-size:19px}
.stat span{font-size:10px;color:#b8c6d3}
#speed{color:#ffcb65;font-size:24px}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:min(90%,370px);padding:20px;background:#101820ed;border:1px solid #ffffff35;border-radius:16px;text-align:center;pointer-events:auto}
#message h1{font-size:25px;margin:0 0 8px}
#message p{color:#cbd5e1;font-size:13px;line-height:1.5}
button{border:0;border-radius:10px;background:#ff5b35;color:white;font-weight:800;padding:12px;cursor:pointer;touch-action:none}
#message button{width:100%;margin-top:8px}
#message .accent{color:#ff5b35}
body:not(.racing):before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(5,8,12,.88),rgba(5,8,12,.48) 52%,rgba(5,8,12,.2)),linear-gradient(0deg,rgba(5,8,12,.8),transparent 58%)}
#message:not(.home-menu){z-index:3}
#message.home-menu{position:static;transform:none;width:100%;height:100%;max-width:none;padding:0;background:transparent;border:0;border-radius:0;pointer-events:none;overflow:visible}
.home-brand,.home-actions,#message .gear-button{z-index:3}
.home-brand{position:fixed;top:10%;left:7%;text-align:left;pointer-events:none;text-shadow:0 3px 18px #000}
.home-brand h1{font-size:clamp(28px,5vw,58px)!important;letter-spacing:3px;margin:8px 0!important}
.home-brand p{font-size:11px!important;letter-spacing:4px;color:#d0d7df!important;margin:0}
.brand-mark{display:inline-grid;place-items:center;width:42px;height:42px;border:2px solid #ff5b35;border-radius:12px;color:#ff5b35;font-size:26px;font-weight:1000}
.home-actions{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,80vw);display:flex;gap:12px;pointer-events:auto}
#message .home-actions button{flex:1;min-height:54px;font-size:14px;letter-spacing:2px;border-radius:12px}
#message .gear-button{position:fixed;top:14px;right:16px;width:42px;height:42px;margin:0;padding:0;border-radius:50%;background:#0d1219d9;border:1px solid #ffffff40;color:#fff;font-size:19px;pointer-events:auto}
#analogSpeedo{width:174px;height:105px;align-self:flex-end;margin:0 10px -3px;flex:0 0 174px;pointer-events:none;filter:drop-shadow(0 3px 8px #000b)}
#analogSpeedo svg{width:100%;height:100%;display:block}
#controls{align-items:flex-end;justify-content:space-between;gap:8px}
#controls .steering-group{flex:0 0 auto}
#controls .controlgroup:last-child{flex:0 0 auto}
body:not(.racing) #analogSpeedo{display:none}
body.racing .stats .stat:last-child{display:none}
body:not(.racing) .topbar{display:none}
#message .secondary{background:#202833;border:1px solid #ffffff24}
#message .track-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
#message .track-card{min-height:70px;text-align:left;background:#171d25;border:1px solid #ffffff20;padding:10px}
#message .track-card strong{display:block;font-size:12px}
#message .track-card small{display:block;color:#bac5d1;font-size:10px;margin-top:5px}
#message select{width:100%;margin:7px 0 3px;padding:12px;border-radius:10px;border:1px solid #ffffff40;background:#202d39;color:#fff;font-weight:700}
#message .menu-row{display:flex;gap:8px}
#message .menu-row button{flex:1}
#raceTools{position:fixed;top:205px;left:12px;display:none;gap:7px;pointer-events:auto}
#raceTools button{padding:9px 12px;background:#101820dd;border:1px solid #ff5b3566;font-size:11px}
body.racing #raceTools{display:flex}
body.racing #controls{display:flex}
body:not(.racing) .topbar{display:none}
body:not(.racing) #minimap,body:not(.racing) #nitroWrap,body:not(.racing) #hint{display:none}
body:not(.racing) #controls{display:none}
body.paused #controls{display:none}
#rotateNotice{display:none;position:fixed;inset:0;z-index:50;background:#080b10;color:#fff;align-items:center;justify-content:center;text-align:center;padding:25px;font-weight:900;letter-spacing:2px}
#minimap{position:fixed;top:12px;right:12px;left:auto;width:176px;padding:7px 9px;background:#0a0d12df;z-index:2}
#minimap svg{display:block;width:100%;height:auto;margin-top:3px}
.mapLabel{font-size:9px;letter-spacing:1.4px;font-weight:900;color:#ff7256}
.mapLegend{display:flex;justify-content:space-between;font-size:8px;color:#b8c6d3}
.stats .stat:last-child{position:fixed;left:50%;bottom:103px;transform:translateX(-50%);min-width:108px;padding:8px 16px;border-color:#ff5b3577;background:#090d13e8}
.stats .stat:last-child strong{font-size:34px;line-height:1;color:#ffcb65}
.stats .stat:last-child span{font-size:9px;letter-spacing:1.5px}
@media(max-width:520px){
 #minimap{top:7px;right:7px;left:auto;width:132px;padding:5px 7px}
 #raceTools{top:174px;left:7px}
 .mapLabel{font-size:8px}
 .mapLegend{font-size:7px}
 .stats .stat:last-child{bottom:96px;min-width:82px;padding:6px 10px}
 .stats .stat:last-child strong{font-size:26px}
 #message{top:50%;left:50%;transform:translate(-50%,-50%);width:min(92%,560px);max-height:88vh;overflow-y:auto;padding:15px}
 #message.home-menu{top:0;left:0;transform:none;width:100%;height:100%;max-height:none;overflow:visible}
 .home-brand{top:12%;left:6%}
 .home-brand h1{font-size:clamp(25px,7vw,42px)!important}
 .home-actions{bottom:18px;width:88vw;gap:8px}
 #message .home-actions button{min-height:48px;font-size:12px}
 #message .gear-button{top:10px;right:10px}
 #analogSpeedo{width:124px;height:76px;flex-basis:124px;margin:0 3px -1px}
 #controls{gap:3px;padding:0 7px}
 #controls .controlgroup{gap:4px}
 #controls .ctrl{width:40px}
 #controls .ctrl.pedal{width:46px}
 #controls .ctrl.nitro{width:45px}

 #message .track-grid{gap:5px}
 #message .track-card{min-height:58px;padding:7px}
 #message .track-card strong{font-size:10px}
 #message .track-card small{font-size:9px}
}
@media(orientation:portrait){#rotateNotice{display:flex}}
#trackSelect{width:100%;margin:7px 0 3px;padding:12px;border-radius:10px;border:1px solid #ffffff40;background:#202d39;color:#fff;font-weight:700}
#countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:#08111b55;font-size:clamp(64px,18vw,132px);font-weight:1000;letter-spacing:3px;color:#fff;text-shadow:0 5px 0 #b72f1d,0 0 32px #ff5b35;pointer-events:none}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.controlgroup{display:flex;gap:7px;pointer-events:auto}
.ctrl{width:54px;height:56px;border-radius:15px;background:#18232ddd;border:1px solid #ffffff55;font-size:21px;user-select:none}
.ctrl.reverse{background:#252b34;border-color:#ff5b3566;font-size:13px}
.ctrl.pedal{width:62px;height:78px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 11px;clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);border:0;border-radius:7px 7px 12px 12px;box-shadow:inset 0 0 0 2px #ffffff45, inset 0 10px 16px #ffffff18;position:relative;font-size:11px;letter-spacing:1px}
.ctrl.pedal:before{content:"";position:absolute;left:22%;right:22%;top:12px;height:34px;border-radius:4px;background:repeating-linear-gradient(0deg,#101820 0 4px,#68737c 4px 7px);opacity:.8}
.ctrl.pedal span{position:relative;z-index:1;text-shadow:0 1px 3px #000}
.ctrl.gas{background:linear-gradient(135deg,#ff6a3d,#a91f16);border-color:#ffb39f}
.ctrl.brake{background:linear-gradient(135deg,#aab5c0,#3b4653);color:#111820;border-color:#eef2f5}
.ctrl.nitro{width:60px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(145deg,#16b8ff,#075b9e);border:1px solid #9be8ff;font-size:22px;box-shadow:0 0 12px #1685c755}
.ctrl.nitro small{font-size:9px;font-weight:900;letter-spacing:.6px}
#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffa8;white-space:nowrap}
#nitroWrap{position:absolute;top:82px;right:12px;width:118px;background:#101820dc;border:1px solid #ffffff26;border-radius:9px;padding:6px}
#nitroLabel{font-size:10px;font-weight:800;margin-bottom:5px;color:#7bd7ff}
#nitroTrack{height:7px;background:#334155;border-radius:8px;overflow:hidden}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#16b8ff,#b6f2ff);transition:width .08s}
@media(max-width:520px){
 .topbar{padding:7px;gap:4px}
 .panel{padding:7px}
 .brand{font-size:13px}
 .small{font-size:9px}
 .stats{gap:3px}
 .stat strong{font-size:15px}
 .stat span{font-size:8px}
 .stats .stat{min-width:48px}
 #speed{font-size:18px}
 .ctrl{width:45px;height:50px}
 .ctrl.pedal{width:52px;height:69px;padding-bottom:9px}
 .ctrl.pedal:before{top:10px;height:30px}
 .ctrl.nitro{width:52px;height:56px;font-size:19px}
 .ctrl.nitro small{font-size:8px}
 #controls{padding:0 7px;bottom:19px}
 #nitroWrap{top:66px;right:7px;width:95px}
 .ctrl.nitro{font-size:10px}
 #nitroWrap{top:66px;right:7px;width:95px}
 .ctrl.nitro{font-size:10px}
 #nitroWrap{top:66px;right:7px;width:95px}
 .ctrl.nitro{font-size:10px}
 #message{top:50%;left:50%;transform:translate(-50%,-50%);width:min(92%,560px);max-height:88vh;overflow-y:auto;padding:15px}
}
/* HUD placement: minimap upper-right, distance metrics below it, vertical nitro beside its button. */
.topbar .stats{position:fixed;top:124px;right:12px;left:auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;z-index:3}
.topbar .stats .stat{min-width:86px;padding:7px 10px;background:#0a0d12e8;border:1px solid #ffffff2a}
.topbar .stats .stat strong{font-size:22px;line-height:1.1}
.topbar .stats .stat span{font-size:8px;letter-spacing:1px}
.topbar .stats .stat:last-child{position:static;left:auto;bottom:auto;transform:none;min-width:86px;padding:7px 10px}
.topbar .stats .stat:last-child strong{font-size:22px}
#minimap{top:12px;right:12px;left:auto}
#nitroWrap{position:relative;inset:auto;width:9px;height:62px;padding:2px;flex:0 0 9px;background:#101820dc;border:1px solid #ffffff45;border-radius:8px;display:flex;align-items:stretch}
#nitroTrack{width:100%;height:100%;background:#334155;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}
#nitroFill{width:100%;height:100%;background:linear-gradient(0deg,#078bd0,#b6f2ff);transition:height .08s}
.nitro-row{display:flex;align-items:center;justify-content:center;gap:4px}
.accelerator-stack{display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
.ctrl.nitro{width:52px;height:51px;font-size:20px;flex:0 0 auto}
.ctrl.nitro small{font-size:9px;letter-spacing:0}
.ctrl.brake span{font-size:9px;line-height:1.25}
@media(max-width:520px){
 .topbar .stats{top:98px;right:7px;gap:4px}
 .topbar .stats .stat,.topbar .stats .stat:last-child{min-width:68px;padding:5px 7px}
 .topbar .stats .stat strong,.topbar .stats .stat:last-child strong{font-size:17px}
 .topbar .stats .stat span{font-size:7px}
 #minimap{top:7px;right:7px;left:auto;width:132px}
 #nitroWrap{height:53px;width:8px;flex-basis:8px}
 .ctrl.nitro{width:45px;height:47px;font-size:17px}
 .ctrl.nitro small{font-size:8px}
 .accelerator-stack{gap:3px}
}
</style>
</head>
<body>
<div id="hud">
  <div class="topbar">
    <div class="panel">
      <div class="brand">1711 <span>RACING</span></div>
      <div class="small">3D CIRCUIT</div>
    </div>
    <div class="stats">
      <div class="panel stat"><strong id="lap">0%</strong><span>FINISH</span></div>
      <div class="panel stat"><strong id="remaining">7.6</strong><span>SISA KM</span></div>
    </div>
  </div>

  <div id="message" class="home-menu">
    <div class="home-brand"><span class="brand-mark">T</span><h1>TETENG <span class="accent">RACING</span></h1><p>DRIVE YOUR OWN LINE</p></div>
    <button class="gear-button" data-menu="settings" aria-label="Settings" title="Settings">⚙</button>
    <div class="home-actions"><button data-menu="play">PLAY</button><button data-menu="garage" class="secondary">SELECT CAR</button></div>
  </div>

  <div id="minimap" class="panel" aria-label="Circuit minimap">
    <div class="mapLabel">CIRCUIT MAP</div>
    <svg viewBox="0 0 140 70" role="img" aria-label="Route from start to finish">
      <path id="mapPath" d="M2 35 L138 35" fill="none" stroke="#697481" stroke-width="3" stroke-linecap="round"/>
      <circle cx="138" cy="35" r="3.5" fill="#ffffff" stroke="#ff5b35" stroke-width="1.5"/>
      <circle id="mapDot" cx="2" cy="35" r="4" fill="#ff5b35" stroke="#ffffff" stroke-width="1.5"/>
    </svg>
    <div class="mapLegend"><span>START</span><span>FINISH</span></div>
  </div>
  <div id="raceTools"><button id="cameraToggle">CAM: CHASE</button><button id="pauseToggle">Ⅱ PAUSE</button></div>
  <div id="rotateNotice">ROTATE YOUR DEVICE TO LANDSCAPE</div>
  <div id="countdown">3</div>
  
  <div id="controls">
    <div class="controlgroup steering-group">
      <button class="ctrl" data-control="left" aria-label="Steer left">◀</button>
      <button class="ctrl" data-control="right" aria-label="Steer right">▶</button>
    </div>
    <div id="analogSpeedo" aria-label="Analog speedometer">
      <svg viewBox="0 0 180 108" role="img" aria-label="Speed in kilometers per hour">
        <path d="M18 88 A72 72 0 0 0 162 88" fill="none" stroke="#27313b" stroke-width="13" stroke-linecap="round"/>
        <path d="M18 88 A72 72 0 0 0 162 88" fill="none" stroke="#ff5b35" stroke-width="3" stroke-linecap="round"/>
        <g id="speedTicks" stroke="#d9e2ea" stroke-width="2" stroke-linecap="round"></g>
        <g id="speedLabels" fill="#e7edf3" font-size="9" font-weight="700" text-anchor="middle"></g>
        <line id="speedNeedle" x1="90" y1="88" x2="90" y2="30" stroke="#ff4934" stroke-width="3.2" stroke-linecap="round" transform="rotate(-135 90 88)"/>
        <circle cx="90" cy="88" r="6" fill="#f5f7fa" stroke="#ff4934" stroke-width="2"/>
        <text id="analogSpeedValue" x="90" y="72" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="900">0</text>
        <text x="90" y="101" text-anchor="middle" fill="#b8c6d3" font-size="8" letter-spacing="1.3">KM/H</text>
      </svg>
    </div>
    <div class="controlgroup">
      <button class="ctrl pedal brake" data-control="brake" aria-label="Rem dan mundur"><span>REM<br>REV</span></button>
      <div class="accelerator-stack">
        <div class="nitro-row"><div id="nitroWrap" aria-label="Sisa nitro"><div id="nitroTrack"><div id="nitroFill"></div></div></div><button class="ctrl nitro" data-control="nitro" aria-label="Nitro roket">🚀<small id="nitroPct">100%</small></button></div>
        <button class="ctrl pedal gas" data-control="gas" aria-label="Pedal gas"><span>GAS</span></button>
      </div>
    </div>
  </div>
  <div id="hint">Ikuti lintasan dan hindari rumput!</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5df);
scene.fog=new THREE.Fog(0x9bc5df,170,430);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));

scene.add(new THREE.HemisphereLight(0xe3f3ff,0x4d6345,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-80,120,50);
scene.add(sun);

const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grassMat=mat(0x477b3d);
const roadMat=mat(0x343b43);
const whiteMat=mat(0xffffff);
const redMat=mat(0xf3442e);
const darkMat=mat(0x20252b);
const glassMat=mat(0x8fc8df,.35);

const nitroGlowMat=new THREE.MeshBasicMaterial({color:0x00bfff,transparent:true,opacity:1,depthWrite:false,toneMapped:false});
const nitroRedMat=new THREE.MeshBasicMaterial({color:0xff1800,transparent:true,opacity:1,depthWrite:false,toneMapped:false});
const nitroOrangeMat=new THREE.MeshBasicMaterial({color:0xff7200,transparent:true,opacity:1,depthWrite:false,toneMapped:false});
const nitroYellowMat=new THREE.MeshBasicMaterial({color:0xfff35a,transparent:true,opacity:1,depthWrite:false,toneMapped:false});

// Tekstur aspal dibuat secara prosedural agar jalan tidak tampak polos seperti balok.
function makeAsphaltTexture(){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=512;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#34383d';ctx.fillRect(0,0,512,512);
 for(let i=0;i<18000;i++){
  const v=35+Math.random()*65;
  ctx.fillStyle='rgba('+v+','+v+','+v+','+(Math.random()*.22)+')';
  const size=Math.random()*2.2+.3;
  ctx.fillRect(Math.random()*512,Math.random()*512,size,size);
 }
 for(let i=0;i<95;i++){
  ctx.strokeStyle='rgba(10,12,14,'+(Math.random()*.12)+')';
  ctx.lineWidth=Math.random()*1.4+.3;
  ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);
  ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke();
 }
 const tex=new THREE.CanvasTexture(canvas);
 tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
 tex.repeat.set(80,2);tex.colorSpace=THREE.SRGBColorSpace;
 return tex;
}
roadMat.map=makeAsphaltTexture();
roadMat.color.set(0xffffff);


const RX=92,RZ=62,ROAD=17,SEG=260,TAU=Math.PI*2;

const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.25;
scene.add(ground);

function trackPoint(t){
 return new THREE.Vector3(RX*Math.sin(t),0,RZ*Math.cos(t));
}
function trackTangent(t){
 return new THREE.Vector3(RX*Math.cos(t),0,-RZ*Math.sin(t)).normalize();
}
function trackNormal(t){
 const d=trackTangent(t);
 return new THREE.Vector3(-d.z,0,d.x);
}
function wrap(t){return ((t%TAU)+TAU)%TAU}
function angleDifference(a,b){
 return ((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI;
}
function trackAngle(p){return Math.atan2(p.x/RX,p.z/RZ)}
function trackDistance(p){
 const q=Math.sqrt((p.x/RX)**2+(p.z/RZ)**2);
 return Math.abs(q-1)*Math.min(RX,RZ);
}

function makeStrip(offset,width,y,material){
 const vertices=[],indices=[];
 for(let i=0;i<=SEG;i++){
  const t=i/SEG*TAU;
  const p=trackPoint(t);
  const n=trackNormal(t);
  const c=p.clone().addScaledVector(n,offset);
  const a=c.clone().addScaledVector(n,-width/2);
  const b=c.clone().addScaledVector(n,width/2);
  vertices.push(a.x,y,a.z,b.x,y,b.z);
  if(i<SEG){
   const k=i*2;
   indices.push(k,k+1,k+2,k+1,k+3,k+2);
  }
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 g.setIndex(indices);
 g.computeVertexNormals();
 scene.add(new THREE.Mesh(g,material));
}

makeStrip(0,ROAD,-.08,roadMat);
makeStrip(ROAD/2+.5,1,-.03,whiteMat);
makeStrip(-ROAD/2-.5,1,-.03,whiteMat);
makeStrip(0,.2,-.025,mat(0xd7d8d7));

for(let i=0;i<SEG;i++){
 const t=i/SEG*TAU;
 const p=trackPoint(t),n=trackNormal(t);
 if(Math.floor(i/3)%2===0){
  for(const side of [-1,1]){
   const c=p.clone().addScaledVector(n,side*(ROAD/2+.8));
   const curb=new THREE.Mesh(new THREE.BoxGeometry(2.2,.22,.85),redMat);
   curb.position.set(c.x,.02,c.z);
   curb.rotation.y=Math.atan2(trackTangent(t).x,trackTangent(t).z);
   scene.add(curb);
  }
 }
 if(i%2===0){
  for(const side of [-1,1]){

function prepareTrackDistance(track){
 const count=Math.ceil(track.distance/10);
 const table=[{x:START_LINE_X,d:0}];
 let previousX=START_LINE_X,previousZ=routeCenter(START_LINE_X,track),distance=0;
 for(let i=1;i<=count;i++){
  const x=START_LINE_X+track.distance*i/count;
  const z=routeCenter(x,track);
  distance+=Math.hypot(x-previousX,z-previousZ);
  table.push({x,d:distance});
  previousX=x;previousZ=z;
 }
 track.arcTable=table;track.arcLength=distance;
}
function trackDistanceAtX(x,track){
 const table=track.arcTable;
 if(!table)return THREE.MathUtils.clamp(x-START_LINE_X,0,track.distance);
 if(x<=START_LINE_X)return 0;
 if(x>=finishLineX)return track.arcLength;
 let lo=0,hi=table.length-1;
 while(hi-lo>1){
  const mid=(lo+hi)>>1;
  if(table[mid].x<x)lo=mid;else hi=mid;
 }
 const a=table[lo],b=table[hi],t=(x-a.x)/(b.x-a.x||1);
 return a.d+(b.d-a.d)*t;
}
function drawMinimap(track){
 const samples=[];
 for(let i=0;i<=100;i++){
  const x=START_LINE_X+track.distance*i/100;
  samples.push({x,z:routeCenter(x,track)});
 }
 const zs=samples.map(p=>p.z);
 track.mapRange={min:Math.min(...zs)-8,max:Math.max(...zs)+8};
 const pts=samples.map((p,i)=>(i*1.36+2).toFixed(2)+','+mapYAtX(p.x,track).toFixed(2));
 document.getElementById('mapPath').setAttribute('d','M'+pts.join(' L'));
 updateMinimapDot(track);
}
function mapYAtX(x,track){
 const range=track.mapRange||{min:-130,max:130};
 const z=routeCenter(x,track);
 return THREE.MathUtils.clamp(66-(z-range.min)/(range.max-range.min||1)*62,3,67);
}
function updateMinimapDot(track){
 const ratio=THREE.MathUtils.clamp((player.position.x-START_LINE_X)/track.distance,0,1);
 const x=2+ratio*136,y=mapYAtX(player.position.x,track);
 const dot=document.getElementById('mapDot');
 dot.setAttribute('cx',x.toFixed(2));dot.setAttribute('cy',y.toFixed(2));
}

// Audio sintetis supercar V12: bass lebih tebal, makin meraung mengikuti kecepatan.
let audioContext=null,engineOsc=null,engineOsc2=null,engineOsc3=null,nitroOsc=null,nitroNoise=null;
let engineGain=null,engineGain2=null,engineGain3=null,nitroGain=null,engineFilter=null,nitroFilter=null;
let engineRPM=0,nitroRocketPitch=0;

function initAudio(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!audioContext){
   audioContext=new AudioCtx();

   engineFilter=audioContext.createBiquadFilter();
   engineFilter.type='lowpass';
   engineFilter.frequency.value=520;
   engineFilter.Q.value=2.2;
   engineGain=audioContext.createGain();
   engineGain.gain.value=0;
   engineOsc=audioContext.createOscillator();
   engineOsc.type='sawtooth';
   engineOsc.frequency.value=38;
   engineOsc.connect(engineFilter);
   engineFilter.connect(engineGain);
   engineGain.connect(audioContext.destination);
   engineOsc.start();

   const bassFilter=audioContext.createBiquadFilter();
   bassFilter.type='lowpass';
   bassFilter.frequency.value=280;
   engineGain2=audioContext.createGain();
   engineGain2.gain.value=0;
   engineOsc2=audioContext.createOscillator();
   engineOsc2.type='sawtooth';
   engineOsc2.detune.value=-7;
   engineOsc2.frequency.value=54;
   engineOsc2.connect(bassFilter);
   bassFilter.connect(engineGain2);
   engineGain2.connect(audioContext.destination);
   engineOsc2.start();

   engineGain3=audioContext.createGain();
   engineGain3.gain.value=0;
   engineOsc3=audioContext.createOscillator();
   engineOsc3.type='triangle';
   engineOsc3.detune.value=5;
   engineOsc3.frequency.value=80;
   engineOsc3.connect(engineGain3);
   engineGain3.connect(audioContext.destination);
   engineOsc3.start();

   // Lapisan roket: dentuman rendah + desis lebar yang naik bersama kecepatan nitro.
   nitroFilter=audioContext.createBiquadFilter();
   nitroFilter.type='lowpass';
   nitroFilter.frequency.value=1000;
   nitroFilter.Q.value=.65;
   nitroGain=audioContext.createGain();
   nitroGain.gain.value=0;
   nitroOsc=audioContext.createOscillator();
   nitroOsc.type='sawtooth';
   nitroOsc.frequency.value=40;
   nitroOsc.connect(nitroFilter);
   nitroFilter.connect(nitroGain);
   nitroGain.connect(audioContext.destination);
   nitroOsc.start();

   const bufferSize=2*audioContext.sampleRate;
   const noiseBuffer=audioContext.createBuffer(1,bufferSize,audioContext.sampleRate);
   const noiseData=noiseBuffer.getChannelData(0);
   for(let i=0;i<bufferSize;i++)noiseData[i]=Math.random()*2-1;
   nitroNoise=audioContext.createBufferSource();
   nitroNoise.buffer=noiseBuffer;
   nitroNoise.loop=true;
   const noiseFilter=audioContext.createBiquadFilter();
   noiseFilter.type='bandpass';
   noiseFilter.frequency.value=1200;
   noiseFilter.Q.value=.4;
   const noiseGain=audioContext.createGain();
   noiseGain.gain.value=0;
   nitroNoise.connect(noiseFilter);
   noiseFilter.connect(noiseGain);
   noiseGain.connect(audioContext.destination);
   nitroNoise.start();
   nitroGain.noiseGain=noiseGain;
   nitroGain.noiseFilter=noiseFilter;
  }
  if(audioContext.state==='suspended')audioContext.resume();
 }catch(err){}
}

function updateSound(dt=1/60){
 if(!audioContext||!engineOsc||audioContext.state!=='running')return;
 const now=audioContext.currentTime;
 const speedRatio=Math.min(1,Math.abs(speed)/MAX_SPEED);
 const active=running&&!paused;
 const throttle=active&&keys.gas&&!keys.reverse;
 // RPM mengikuti kecepatan aktual; throttle memberi sedikit raungan ekstra saat akselerasi.
 const rpmTarget=active?Math.min(1,(speedRatio*.82)+(throttle?.18:0)+(nitroActive?.12:0)):0;
 engineRPM+=(rpmTarget-engineRPM)*(1-Math.exp(-dt*(throttle?1.35:1.8)));
 const rpm=.05+engineRPM*.95;
 const baseFreq=35+rpm*128+(nitroActive?12:0);

 engineOsc.frequency.setTargetAtTime(baseFreq,now,.12);
 engineOsc2.frequency.setTargetAtTime(baseFreq*1.36,now,.14);
 engineOsc3.frequency.setTargetAtTime(baseFreq*1.92,now,.15);
 engineFilter.frequency.setTargetAtTime(300+rpm*1450,now,.15);
 engineGain.gain.setTargetAtTime(active?.026+rpm*.052:0,now,.15);
 engineGain2.gain.setTargetAtTime(active?.018+rpm*.028:0,now,.16);
 engineGain3.gain.setTargetAtTime(active?.003+rpm*.012:0,now,.16);

 const rocket=active&&nitroActive;
 if(rocket)nitroRocketPitch=Math.min(1,nitroRocketPitch+dt*.48);
 else nitroRocketPitch=Math.max(0,nitroRocketPitch-dt*.9);
 const rocketPitch=nitroRocketPitch;
 nitroOsc.frequency.setTargetAtTime(rocket?38+rocketPitch*175:38,now,.12);
 nitroFilter.frequency.setTargetAtTime(rocket?550+rocketPitch*3300:450,now,.12);
 nitroGain.gain.setTargetAtTime(rocket?.035+rocketPitch*.04:0,now,.12);
 if(nitroGain.noiseGain){
  nitroGain.noiseFilter.frequency.setTargetAtTime(rocket?650+rocketPitch*4000:550,now,.12);
  nitroGain.noiseGain.gain.setTargetAtTime(rocket?.012+rocketPitch*.045:0,now,.12);
 }
 if(!soundEnabled){
  [engineGain,engineGain2,engineGain3,nitroGain].forEach(g=>g&&g.gain.setTargetAtTime(0,now,.05));
  if(nitroGain.noiseGain)nitroGain.noiseGain.gain.setTargetAtTime(0,now,.05);
 }
}

// Dunia sirkuit dipasang ulang setiap memilih trek: jalan berkelok, lingkungan, dan gapura start/finish.
let generatedTrackGroup=null;
let legacyWorldHidden=false;
function routeCenter(x,track=trackOptions[selectedTrack]){
 const s=THREE.MathUtils.clamp((x-START_LINE_X)/track.distance,0,1);
 const points=track.profile;
 let i=0;
 while(i<points.length-2&&s>points[i+1][0])i++;
 const p0=points[i],p1=points[i+1];
 const prev=points[Math.max(0,i-1)],next=points[Math.min(points.length-1,i+2)];
 const span=p1[0]-p0[0];
 const t=span>0?(s-p0[0])/span:0;
 const m0=(p1[1]-prev[1])/(p1[0]-prev[0]||1);

function buildSpeedometer(){
 const ticks=document.getElementById('speedTicks'),labels=document.getElementById('speedLabels');
 if(!ticks||!labels||ticks.childElementCount)return;
 for(let i=0;i<=20;i++){
  const angle=(-180+i*9)*Math.PI/180;
  const major=i%4===0;
  const r1=major?59:64,r2=70;
  const x1=90+Math.cos(angle)*r1,y1=88+Math.sin(angle)*r1;
  const x2=90+Math.cos(angle)*r2,y2=88+Math.sin(angle)*r2;
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
  line.setAttribute('stroke',major?'#f3f6f9':'#8b98a5');line.setAttribute('stroke-width',major?'2.5':'1.3');ticks.appendChild(line);
  if(major){
   const val=i*20,lr=48;
   const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
   txt.setAttribute('x',90+Math.cos(angle)*lr);txt.setAttribute('y',88+Math.sin(angle)*lr+3);
   txt.textContent=val;labels.appendChild(txt);
  }
 }
}

 '<p>CONTROLS<br>W / ↑ Gas · ↓ Brake / Reverse · A/D Steer · Shift / X Nitro</p><button data-menu="main">BACK</button>';
}
function showPauseMenu(){
 paused=true;document.body.classList.add('paused');
 message.className='';
 message.style.display='block';
 message.innerHTML='<h1>PAUSED</h1><button data-action="resume">RESUME</button><button data-action="again" class="secondary">RESTART</button><button data-menu="main" class="secondary">EXIT TO MAIN MENU</button>';
}
function applyGraphicsQuality(value){
 graphicsQuality=value==='low'?'low':'high';
 renderer.setPixelRatio(Math.min(devicePixelRatio,graphicsQuality==='high'?1.65:1));
 renderer.shadowMap.enabled=graphicsQuality==='high';
}
message.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.menu==='play')showCircuitSelect();
 else if(b.dataset.menu==='garage')showGarage();
 else if(b.dataset.menu==='settings')showSettings();
 else if(b.dataset.menu==='main')showMainMenu();
 else if(b.dataset.track!==undefined){selectedTrack=Number(b.dataset.track)||0;startGame();}
 else if(b.id==='start')startGame();
 else if(b.dataset.action==='again')startGame();
 else if(b.dataset.action==='resume'){paused=false;document.body.classList.remove('paused');message.style.display='none';}
 else if(b.dataset.action==='sound'){soundEnabled=!soundEnabled;showSettings();}
});
message.addEventListener('change',e=>{
 if(e.target.id==='carSelect')applyCarChoice(e.target.value);
 if(e.target.id==='cameraSelect'){cameraMode=e.target.value;const toggle=document.getElementById('cameraToggle');if(toggle)toggle.textContent='CAM: '+cameraMode.toUpperCase();}
 if(e.target.id==='graphicsSelect')applyGraphicsQuality(e.target.value);
});
document.getElementById('cameraToggle').addEventListener('click',()=>{
 cameraMode=cameraMode==='chase'?'hood':'chase';
 document.getElementById('cameraToggle').textContent='CAM: '+cameraMode.toUpperCase();
});
document.getElementById('pauseToggle').addEventListener('click',()=>{if(!paused)showPauseMenu();});


// Tombol layar sentuh.
document.querySelectorAll('[data-control]').forEach(btn=>{
 const key=btn.dataset.control;

 const down=e=>{
  e.preventDefault();
  keys[key]=true;
  try{btn.setPointerCapture(e.pointerId)}catch{}
 };
 const up=e=>{
  e.preventDefault();
  keys[key]=false;
 };

 btn.addEventListener('pointerdown',down);
 btn.addEventListener('pointerup',up);
 btn.addEventListener('pointercancel',up);
 btn.addEventListener('lostpointercapture',()=>keys[key]=false);
 btn.addEventListener('contextmenu',e=>e.preventDefault());
});

// Keyboard: S khusus mundur, panah bawah khusus rem.
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();

 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){
  e.preventDefault();
 }

 if(k==='arrowup'||k==='w')keys.gas=true;
 if(k==='arrowdown')keys.brake=true;
 if(k==='s')keys.reverse=true;
 if(k==='arrowleft'||k==='a')keys.left=true;
 if(k==='arrowright'||k==='d')keys.right=true;
 if(k==='shift'||k==='x')keys.nitro=true;
});

addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();

 if(k==='arrowup'||k==='w')keys.gas=false;
 if(k==='arrowdown')keys.brake=false;
 if(k==='s')keys.reverse=false;
 if(k==='arrowleft'||k==='a')keys.left=false;
 if(k==='arrowright'||k==='d')keys.right=false;
 if(k==='shift'||k==='x')keys.nitro=false;
});

addEventListener('blur',()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

function updatePlayer(dt){
 // Gas dan mundur tidak aktif bersamaan.
 if(keys.gas&&!keys.reverse){
  // Di bawah 60 km/jam, kenaikan lebih halus dan lambat; setelah itu akselerasi tetap bertahap.
  const lowSpeedFactor=Math.abs(speed)<(60/2.25)?1.25:1;
  speed+=8.5*lowSpeedFactor*dt;
 }else if(keys.reverse&&!keys.gas){
  speed-=12*dt;
 }else if(!keys.brake){
  speed*=Math.exp(-.11*dt);
 }

 // Pedal gabungan: mengerem saat maju, lalu mundur setelah kecepatan nol.
 if(keys.brake){
  if(speed>0)speed=Math.max(0,speed-9*dt);
  else speed=Math.max(-MAX_REVERSE,speed-5*dt);
 }

 nitroActive=keys.nitro&&nitro>0;
 if(nitroActive){
  nitro=Math.max(0,nitro-24*dt);
  speed+=11*dt;
 }else{
  nitro=Math.min(100,nitro+8*dt);
 }
 // Batas nitro tidak langsung memotong kecepatan saat tombol dilepas.
 // Mobil melambat secara alami kembali ke batas normal.
 speed=THREE.MathUtils.clamp(speed,-MAX_REVERSE,NITRO_SPEED);
 player.userData.nitroFlames.forEach(f=>{f.visible=nitroActive; if(nitroActive)f.scale.setScalar(.75+Math.random()*.7);});

 const steering=(keys.right?1:0)-(keys.left?1:0);
 const speedFraction=Math.min(1,Math.abs(speed)/MAX_SPEED);
 // Input setir naik/turun secara bertahap agar mobil tidak langsung menyentak.
 const steeringSmooth=1-Math.exp(-dt*3.2);
 steeringInput+=(steering-steeringInput)*steeringSmooth;
 if(Math.abs(speed)>.3){
  const reverseFactor=speed>=0?1:-1;
  const turnRate=1.35;
  const steeringResponse=0.28+speedFraction*0.72;
  heading-=steeringInput*turnRate*dt*steeringResponse*reverseFactor;
 }
 // Arah mobil mengikuti tikungan sirkuit, sementara input setir tetap mengatur posisi di lintasan.
 const curveHeading=Math.atan2(1,routeSlope(player.position.x,trackOptions[selectedTrack]));
 heading+=angleDifference(curveHeading,heading)*Math.min(1,dt*(1.2+speedFraction*1.2));
 // Body roll ringan dan lembut mengikuti setir yang sudah dihaluskan.
 const targetRoll=-steeringInput*speedFraction*0.035;
 player.rotation.z+=(targetRoll-player.rotation.z)*(1-Math.exp(-dt*3.2));
 player.rotation.y=heading+Math.PI;
 player.position.addScaledVector(forwardFromHeading(heading),speed*dt);
 // Putaran roda dibuat terbaca, tidak terlalu cepat hingga terlihat seperti roda polos.
 const wheelSpin=speed*dt*.42;
 player.userData.wheels.forEach(w=>{
  // Putaran ban dan arah setir memakai sumbu terpisah agar ban tetap stabil.
  w.wheel.rotation.x+=wheelSpin;
  w.pivot.rotation.y=w.front? -steeringInput*.48:0;
 });


 // Tepi jalan tidak memantulkan mobil: tetap di tepi, lalu belokkan arah secara perlahan ke dalam.
 edgeCollisionCooldown=Math.max(0,edgeCollisionCooldown-dt);
 const safeEdge=11.35;
 const roadCenter=routeCenter(player.position.x,trackOptions[selectedTrack]);
 const lateral=player.position.z-roadCenter;
 if(lateral>safeEdge||lateral< -safeEdge){
  player.position.z=roadCenter+THREE.MathUtils.clamp(lateral,-safeEdge,safeEdge);
  speed*=Math.exp(-.16*dt);
  steeringInput*=Math.exp(-1.8*dt);
  nitroActive=false;keys.nitro=false;
 }

 // Mode sirkuit kota: uji akselerasi tetap aktif, AI masih nonaktif.
}

function updateAI(dt){
 return; // Mode tes lurus tanpa lawan AI.
 for(let i=0;i<ai.length;i++){
  const a=ai[i];
  if(a.finished)continue;

  let desired=[-3,0,3][i];

  // AI berusaha menghindari mobil lain.
  for(let j=0;j<ai.length;j++){
   if(i===j)continue;
   const other=ai[j];
   const gap=other.progress-a.progress;

   if(gap>.005&&gap<.10){
    desired=a.lane>=0?-4:4;
   }
  }

  const playerGap=playerProgress-a.progress;
  if(playerGap>-.015&&playerGap<.075){
   desired=a.lane>=0?-4:4;
  }

  a.targetLane=desired;
  a.lane=THREE.MathUtils.damp(a.lane,a.targetLane,1.8,dt);

  a.progress+=a.speed*dt;
  placeCar(a.car,a.progress,a.lane);
  a.car.userData.wheels.forEach(w=>w.wheel.rotation.x+=a.speed*dt*35);

  if(a.progress>=FINISH_PROGRESS){
   a.progress=FINISH_PROGRESS;
   a.finished=true;
   if(!raceOver)finishRace(a.name);
  }
 }
}

function handleCarCollisions(dt){
 // Tabrakan sederhana: mobil pemain terdorong dan kehilangan sebagian kecepatan.
 collisionCooldown=Math.max(0,collisionCooldown-dt);
 for(const a of ai){
  const dx=player.position.x-a.car.position.x;
  const dz=player.position.z-a.car.position.z;
  const distance=Math.sqrt(dx*dx+dz*dz);
  if(distance<2.65){
   if(distance>0.001){
    const push=(2.65-distance)*0.55;
    player.position.x+=(dx/distance)*push;
    player.position.z+=(dz/distance)*push;
   }
   if(collisionCooldown<=0){
    speed*=0.62;
    collisionCooldown=0.7;
   }
  }
 }
}

function update(dt){
 if(paused)return;
 if(countdownActive){
  countdownTimer+=dt;
  if(countdownTimer>=1){
   countdownTimer=0;countdownValue--;
   const cd=document.getElementById('countdown');
   if(countdownValue>0)cd.textContent=String(countdownValue);
   else{countdownActive=false;running=true;cd.textContent='GO!';setTimeout(()=>{if(!countdownActive)cd.style.display='none';},650);}
  }
  return;
 }
 if(!running)return;
 elapsed+=dt;updatePlayer(dt);
 if(player.position.x>=finishLineX&&Math.cos(heading)>-.1)finishRace();
 updateHUD();
}

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 updateSound(dt);

 if(cameraMode==='hood'){
  const forward=forwardFromHeading(heading);
  camera.position.copy(player.position).addScaledVector(forward,1.25);
  camera.position.y+=1.22;
  const target=player.position.clone().addScaledVector(forward,28);
  target.y+=1.0;
  camera.fov=76;camera.lookAt(target);
 }else{
  const cameraDistance=5.15;
  const behind=new THREE.Vector3(-Math.sin(heading)*cameraDistance,2.65,-Math.cos(heading)*cameraDistance);
  camera.position.copy(player.position).add(behind);
  camera.fov=68;
  camera.lookAt(player.position.x,player.position.y+.92,player.position.z);
 }
 camera.updateProjectionMatrix();
 renderer.render(scene,camera);
}

buildSpeedometer();
showMainMenu();
applyCarChoice(selectedCar);
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
