
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1711 Racing 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111820;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;gap:8px}
.panel{background:#101820dc;border:1px solid #ffffff26;border-radius:12px;padding:10px 12px}
.brand{font-weight:900;font-size:18px;letter-spacing:1px}
.brand span{color:#ff5b35}
.small{font-size:11px;color:#b8c6d3;margin-top:4px}
.stats{display:flex;gap:6px;text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{font-size:10px;color:#b8c6d3}
#speed{font-size:26px;color:#ffcb65}
#message{position:absolute;top:27%;left:50%;transform:translateX(-50%);width:min(90%,370px);padding:20px;background:#101820ed;border:1px solid #ffffff35;border-radius:16px;text-align:center;pointer-events:auto}
#message h1{font-size:26px;margin:0 0 8px}
#message p{color:#cbd5e1;font-size:13px;line-height:1.5}
button{border:0;border-radius:10px;background:#ff5b35;color:white;font-weight:800;padding:13px 18px;cursor:pointer;touch-action:none}
#message button{width:100%;margin-top:8px}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.controlgroup{display:flex;gap:9px;pointer-events:auto}
.ctrl{width:60px;height:60px;border-radius:17px;background:#18232ddd;border:1px solid #ffffff55;font-size:23px;user-select:none}
.ctrl.gas{background:#dc492bde}
.ctrl.brake{background:#394b60e8;font-size:12px}
#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffa8;white-space:nowrap}
@media(max-width:520px){
 .topbar{padding:8px;gap:5px}
 .panel{padding:8px}
 .brand{font-size:14px}
 .small{font-size:9px}
 .stats{gap:4px}
 .stat strong{font-size:16px}
 .stat span{font-size:9px}
 #speed{font-size:20px}
 #controls{padding:0 12px;bottom:18px}
 .ctrl{width:53px;height:53px}
 #message{top:23%;padding:15px}
}
</style>
</head>
<body>
<div id="hud">
 <div class="topbar">
  <div class="panel">
   <div class="brand">1711 <span>RACING</span></div>
   <div class="small">3D CIRCUIT</div>
  </div>
  <div class="stats">
   <div class="panel stat"><strong id="position">4/4</strong><span>POSISI</span></div>
   <div class="panel stat"><strong id="lap">1/3</strong><span>PUTARAN</span></div>
   <div class="panel stat"><strong id="speed">0</strong><span>KM/J</span></div>
  </div>
 </div>

 <div id="message">
  <h1>1711 RACING 3D</h1>
  <p>Kalahkan 3 pembalap AI. Selesaikan 3 putaran dan jadilah yang pertama mencapai garis finis!</p>
  <button id="start">MULAI BALAPAN</button>
  <p>Keyboard: W/↑ gas · S/↓ rem · A/D atau ←/→ belok</p>
 </div>

 <div id="controls">
  <div class="controlgroup">
   <button class="ctrl" data-control="left" aria-label="Belok kiri">◀</button>
   <button class="ctrl" data-control="right" aria-label="Belok kanan">▶</button>
  </div>
  <div class="controlgroup">
   <button class="ctrl brake" data-control="brake">REM</button>
   <button class="ctrl gas" data-control="gas">▲</button>
  </div>
 </div>
 <div id="hint">Ikuti lintasan dan hindari rumput!</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5df);
scene.fog=new THREE.Fog(0x9bc5df,170,430);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));

scene.add(new THREE.HemisphereLight(0xe3f3ff,0x4d6345,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-80,120,50);
scene.add(sun);

const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grassMat=mat(0x477b3d),roadMat=mat(0x343b43);
const whiteMat=mat(0xffffff),redMat=mat(0xf3442e);
const darkMat=mat(0x20252b),glassMat=mat(0x8fc8df,.35);

const RX=92,RZ=62,ROAD=17,SEG=260,TAU=Math.PI*2;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.25;
scene.add(ground);

function makeStrip(offset,width,y,material){
 const vertices=[],indices=[];
 for(let i=0;i<=SEG;i++){
  const t=i/SEG*TAU;
  const p=trackPoint(t);
  const n=trackNormal(t);
  const c=p.clone().addScaledVector(n,offset);
  const a=c.clone().addScaledVector(n,-width/2);
  const b=c.clone().addScaledVector(n,width/2);
  vertices.push(a.x,y,a.z,b.x,y,b.z);
  if(i<SEG){
   const k=i*2;
   indices.push(k,k+1,k+2,k+1,k+3,k+2);
  }
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 g.setIndex(indices);
 g.computeVertexNormals();
 scene.add(new THREE.Mesh(g,material));
}
function trackPoint(t){
 return new THREE.Vector3(RX*Math.sin(t),0,RZ*Math.cos(t));
}
function trackTangent(t){
 return new THREE.Vector3(RX*Math.cos(t),0,-RZ*Math.sin(t)).normalize();
}
function trackNormal(t){
 const d=trackTangent(t);
 return new THREE.Vector3(-d.z,0,d.x);
}
function wrap(t){return ((t%TAU)+TAU)%TAU}
function angleDifference(a,b){
 return ((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI;
}
function trackAngle(p){return Math.atan2(p.x/RX,p.z/RZ)}
function trackDistance(p){
 const q=Math.sqrt((p.x/RX)**2+(p.z/RZ)**2);
 return Math.abs(q-1)*Math.min(RX,RZ);
}

makeStrip(0,ROAD,-.08,roadMat);
makeStrip(ROAD/2+.5,1,-.03,whiteMat);
makeStrip(-ROAD/2-.5,1,-.03,whiteMat);
makeStrip(0,.2,-.025,mat(0xd7d8d7));

for(let i=0;i<SEG;i++){
 if(Math.floor(i/3)%2===0){
  const t=i/SEG*TAU,p=trackPoint(t),n=trackNormal(t);
  for(const side of [-1,1]){
   const c=p.clone().addScaledVector(n,side*(ROAD/2+.8));
   const curb=new THREE.Mesh(new THREE.BoxGeometry(2.2,.22,.85),redMat);
   curb.position.set(c.x,.02,c.z);
   curb.rotation.y=Math.atan2(trackTangent(t).x,trackTangent(t).z);
   scene.add(curb);
  }
 }
 if(i%2===0){
  const t=i/SEG*TAU,p=trackPoint(t),n=trackNormal(t);
  for(const side of [-1,1]){
   const c=p.clone().addScaledVector(n,side*(ROAD/2+2.2));
   const rail=new THREE.Mesh(new THREE.BoxGeometry(2.3,.65,.3),mat(0xb8c1c8));
   rail.position.set(c.x,.48,c.z);
   rail.rotation.y=Math.atan2(trackTangent(t).x,trackTangent(t).z);
   scene.add(rail);
  }
 }
}

// Garis start/finis melintang jalan di t = 0.
for(let i=0;i<12;i++){
 for(let j=0;j<2;j++){
  const tile=new THREE.Mesh(
   new THREE.BoxGeometry(ROAD/12,.06,.8),
   (i+j)%2===0?whiteMat:darkMat
  );
  tile.position.set((i-5.5)*ROAD/12,.02,RZ+(j-.5)*.4);
  scene.add(tile);
 }

const trunkMat=mat(0x67442b),leavesMat=mat(0x2e6537),leaves2=mat(0x438047);
function tree(x,z,s){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.38*s,2.2*s,6),trunkMat);
 trunk.position.set(x,1.1*s,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(1.5*s,3.8*s,7),Math.random()>.5?leavesMat:leaves2);
 crown.position.set(x,3.6*s,z);scene.add(crown);
}
for(let i=0;i<100;i++){
 const t=i/100*TAU,side=i%2?1:-1;
 const x=(RX+25+Math.random()*55)*Math.sin(t);
 const z=(RZ+25+Math.random()*55)*Math.cos(t);
 tree(x,z,.7+Math.random()*.7);
}

function createCar(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.62,4.2),mat(color,.35));
 body.position.y=.7;g.add(body);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.9,.18,1.15),mat(color,.35));
 hood.position.set(0,1.02,-1.15);g.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.48,.72,1.75),glassMat);
 cabin.position.set(0,1.22,.35);g.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.35,.12,1.35),mat(color,.4));
 roof.position.set(0,1.6,.4);g.add(roof);
 const bumper=new THREE.Mesh(new THREE.BoxGeometry(2,.22,.35),darkMat);
 bumper.position.set(0,.48,2.08);g.add(bumper);
 const wheels=[];
 for(const x of [-1.05,1.05]){
  for(const z of [-1.35,1.35]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,12),darkMat);
   w.rotation.z=Math.PI/2;
   w.position.set(x,.45,z);
   g.add(w);wheels.push(w);
  }
 }
 const lampMat=new THREE.MeshBasicMaterial({color:0xfff3ca});
 for(const x of [-.65,.65]){
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.35,.17,.08),lampMat);
  lamp.position.set(x,.78,-2.12);g.add(lamp);
 }
 g.userData.wheels=wheels;
 scene.add(g);
 return g;
}
function placeCar(car,t,lane=0){
 t=wrap(t);
 const p=trackPoint(t).addScaledVector(trackNormal(t),lane);
 car.position.set(p.x,0,p.z);
 const d=trackTangent(t);
 car.rotation.y=Math.atan2(d.x,d.z);
}
function forwardFromHeading(h){return new THREE.Vector3(Math.sin(h),0,Math.cos(h))}

const player=createCar(0xd92724);
const ai=[
 {car:createCar(0x2476d2),progress:.13,speed:.31,lane:-3,targetLane:-3,finished:false,name:'Biru'},
 {car:createCar(0xf2c230),progress:.25,speed:.34,lane:0,targetLane:0,finished:false,name:'Kuning'},
 {car:createCar(0xeeeeee),progress:.37,speed:.32,lane:3,targetLane:3,finished:false,name:'Putih'}
];

const keys={left:false,right:false,gas:false,brake:false};
let running=false,playerFinished=false,raceOver=false;
let speed=0,heading=Math.PI/2;
let playerProgress=0,lastAngle=0,elapsed=0;
const TOTAL_LAPS=3,FINISH_PROGRESS=TOTAL_LAPS*TAU;
const MAX_SPEED=42;
const message=document.getElementById('message');

function updateHUD(){
 document.getElementById('lap').textContent=
  Math.min(TOTAL_LAPS,Math.floor(playerProgress/TAU)+1)+'/'+TOTAL_LAPS;
 document.getElementById('speed').textContent=Math.round(speed*4.2);
 const ranks=[
  {name:'Kamu',progress:playerProgress,isPlayer:true},
  ...ai.map(a=>({name:a.name,progress:a.progress,isPlayer:false}))
 ].sort((a,b)=>b.progress-a.progress);
 document.getElementById('position') .textContent=
  (ranks.findIndex(r=>r.isPlayer)+1)+'/4';
}

function finishRace(winner){
 if(raceOver)return;
 raceOver=true;
 running=false;
 const won=winner==='Kamu';
 message.innerHTML=
  '<h1>'+(won?'🏆 KAMU MENANG!':'BALAPAN SELESAI')+'</h1>'+
  '<p>'+(won?'Hebat! Kamu melewati garis finis di posisi pertama.':
  winner+' lebih dulu mencapai garis finis.')+
  '<br>Waktu kamu: '+elapsed.toFixed(1)+' detik.</p>'+
  '<button id="restart">BALAP LAGI</button>';
 message.style.display='block';
 document.getElementById('restart').addEventListener('click',startGame);
}

function startGame(){
 speed=0;heading=Math.PI/2;
 playerProgress=0;lastAngle=0;elapsed=0;
 running=true;playerFinished=false;raceOver=false;
 player.position.set(0,0,RZ);
 player.rotation.y=heading;
 ai.forEach((a,i)=>{
  a.progress=.13+i*.12;
  a.speed=[.31,.34,.32][i];
  a.lane=[-3,0,3][i];
  a.targetLane=a.lane;
  a.finished=false;
  placeCar(a.car,a.progress,a.lane);
 });
 message.style.display='none';
 updateHUD();
}

document.getElementById('start').addEventListener('click',startGame);

document.querySelectorAll('[data-control]').forEach(btn=>{
 const key=btn.dataset.control;
 const down=e=>{e.preventDefault();keys[key]=true;};
 const up=e=>{e.preventDefault();keys[key]=false;};
 btn.addEventListener('pointerdown',down);
 btn.addEventListener('pointerup',up);
 btn.addEventListener('pointercancel',up);
 btn.addEventListener('pointerleave',up);
});
addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.gas=true;
 if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.brake=true;
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.gas=false;
 if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.brake=false;
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

function updatePlayer(dt){
 if(keys.gas)speed+=19*dt;
 else speed-=7*dt;
 if(keys.brake)speed-=26*dt;
 speed=THREE.MathUtils.clamp(speed,0,MAX_SPEED);

 const steering=(keys.right?1:0)-(keys.left?1:0);
 if(speed>.3)heading-=steering*1.8*dt*(.25+speed/MAX_SPEED);

 player.rotation.y=heading;
 player.position.addScaledVector(forwardFromHeading(heading),speed*dt);
 player.userData.wheels.forEach(w=>w.rotation.x+=speed*dt*.6);

 // Perlambat mobil ketika keluar dari area lintasan.
 const dist=trackDistance(player.position);
 if(dist>ROAD/2-1)speed*=Math.max(.94,1-(dist-ROAD/2+1)*.025);

 // Hanya menghitung kemajuan ketika mobil berada dekat lintasan.
 const angle=trackAngle(player.position);
 const delta=angleDifference(angle,lastAngle);
 if(dist<ROAD/2+2 && delta>0 && delta<.22){
  playerProgress+=delta;
 }
 lastAngle=angle;

 if(playerProgress>=FINISH_PROGRESS&&!playerFinished){
  playerProgress=FINISH_PROGRESS;
  playerFinished=true;
  finishRace('Kamu');
 }
}

function updateAI(dt){
 for(let i=0;i<ai.length;i++){
  const a=ai[i];
  if(a.finished)continue;

  // Pindah jalur jika ada lawan yang terlalu dekat di depan.
  let desired=[-3,0,3][i];
  for(let j=0;j<ai.length;j++){
   if(i===j)continue;
   const other=ai[j];
   const gap=other.progress-a.progress;
   if(gap>.005&&gap<.10){
    desired=a.lane>=0?-4:4;
   }
  }
  // Hindari pemain bila posisinya berdekatan.
  const playerGap=playerProgress-a.progress;
  if(playerGap>-.015&&playerGap<.075){
   desired=a.lane>=0?-4:4;
  }
  a.targetLane=desired;
  a.lane=THREE.MathUtils.damp(a.lane,a.targetLane,1.8,dt);

  // AI melaju di sepanjang oval dan progress tetap bertambah antarputaran.
  a.progress+=a.speed*dt;
  placeCar(a.car,a.progress,a.lane);
  a.car.userData.wheels.forEach(w=>w.rotation.x+=a.speed*dt*35);

  if(a.progress>=FINISH_PROGRESS){
   a.progress=FINISH_PROGRESS;
   a.finished=true;
   if(!raceOver)finishRace(a.name);
  }
 }
}

function update(dt){
 if(!running)return;
 elapsed+=dt;
 updatePlayer(dt);
 if(!raceOver)updateAI(dt);
 updateHUD();
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);

 const behind=new THREE.Vector3(-Math.sin(heading)*10,5.3,-Math.cos(heading)*10);
 const target=player.position.clone().add(behind);
 camera.position.lerp(target,.10);
 camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
</body>
</html>
