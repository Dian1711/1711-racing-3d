
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1711 Racing 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111820;color:#fff;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;gap:10px}
.panel{background:#101820d9;border:1px solid #ffffff26;border-radius:12px;padding:10px 14px;backdrop-filter:blur(5px)}
.brand{font-weight:900;font-size:18px;letter-spacing:1px}
.brand span{color:#ff5b35}
.small{font-size:11px;color:#b8c6d3;margin-top:4px}
.stats{display:flex;gap:8px;text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{font-size:10px;color:#b8c6d3}
#speed{font-size:28px;font-weight:900;color:#ffcb65}
#message{position:absolute;top:28%;left:50%;transform:translateX(-50%);text-align:center;background:#101820dd;border:1px solid #ffffff30;border-radius:16px;padding:18px 22px;width:min(88%,360px);pointer-events:auto}
#message h1{font-size:26px;margin:0 0 8px}
#message p{color:#cbd5e1;font-size:13px;line-height:1.5}
button{border:0;border-radius:10px;background:#ff5b35;color:white;font-weight:800;padding:13px 18px;cursor:pointer}
#message button{width:100%;margin-top:8px}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.controlgroup{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:62px;height:62px;border-radius:18px;background:#18232dcc;border:1px solid #ffffff55;color:white;font-size:24px;touch-action:none;user-select:none}
.ctrl.gas{background:#dc492bde}
.ctrl.brake{background:#394b60e8;font-size:12px}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffa8;white-space:nowrap}
@media(min-width:800px){#controls{padding:0 34px}.ctrl{width:68px;height:68px}}
@media(max-height:500px){.topbar{padding:7px}.panel{padding:7px 10px}#controls{bottom:8px}.ctrl{height:50px;width:54px}#message{top:20%;padding:12px}}
</style>
</head>
<body>
<div id="hud">
  <div class="topbar">
    <div class="panel">
      <div class="brand">1711 <span>RACING</span></div>
      <div class="small">3D CIRCUIT • PROTOTYPE</div>
    </div>
    <div class="stats">
      <div class="panel stat"><strong id="position">1/4</strong><span>POSITION</span></div>
      <div class="panel stat"><strong id="lap">1/3</strong><span>LAP</span></div>
      <div class="panel stat"><strong id="speed">0</strong><span>KM/H</span></div>
    </div>
  </div>
  <div id="message">
    <h1>1711 RACING 3D</h1>
    <p>Siap untuk balapan? Kalahkan 3 pembalap AI dan jadilah yang pertama melewati garis finis.</p>
    <button id="start">MULAI BALAPAN</button>
    <p>Keyboard: W / ↑ gas · S / ↓ rem · A D / ← → belok</p>
  </div>
  <div id="controls">
    <div class="controlgroup">
      <button class="ctrl" data-control="left" aria-label="Belok kiri">◀</button>
      <button class="ctrl" data-control="right" aria-label="Belok kanan">▶</button>
    </div>
    <div class="controlgroup">
      <button class="ctrl brake" data-control="brake">REM</button>
      <button class="ctrl gas" data-control="gas">▲</button>
    </div>
  </div>
  <div id="hint">Jaga mobil tetap di lintasan!</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc5df);
scene.fog = new THREE.Fog(0x9bc5df, 170, 430);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 700);
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.getElementById('hud'));

scene.add(new THREE.HemisphereLight(0xe3f3ff,0x4d6345,2.0));
const sun = new THREE.DirectionalLight(0xffffff,2.0);
sun.position.set(-80,120,50);
scene.add(sun);

const mat=(color,roughness=0.85)=>new THREE.MeshStandardMaterial({color,roughness});
const grassMat=mat(0x477b3d), roadMat=mat(0x343b43), whiteMat=mat(0xffffff);
const redMat=mat(0xf3442e), darkMat=mat(0x20252b), glassMat=mat(0x8fc8df,0.35);
const rx=92, rz=62, roadWidth=17, segments=260;
const trackPoints=[];
for(let i=0;i<=segments;i++){
  const t=i/segments*Math.PI*2;
  trackPoints.push(new THREE.Vector3(rx*Math.sin(t),0,rz*Math.cos(t)));
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),grassMat);
ground.rotation.x=-Math.PI/2;ground.position.y=-0.25;scene.add(ground);

function makeStrip(offset,width,y,material){
 const vertices=[],indices=[];
 for(let i=0;i<=segments;i++){
  const t=i/segments*Math.PI*2;
  const p=new THREE.Vector3(rx*Math.sin(t),0,rz*Math.cos(t));
  const tangent=new THREE.Vector3(rx*Math.cos(t),0,-rz*Math.sin(t)).normalize();
  const normal=new THREE.Vector3(-tangent.z,0,tangent.x);
  const center=p.clone().addScaledVector(normal,offset);
  const a=center.clone().addScaledVector(normal,-width/2);
  const b=center.clone().addScaledVector(normal,width/2);
  vertices.push(a.x,y,a.z,b.x,y,b.z);
  if(i<segments){const k=i*2;indices.push(k,k+1,k+2,k+1,k+3,k+2);}
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 g.setIndex(indices);g.computeVertexNormals();
 const mesh=new THREE.Mesh(g,material);scene.add(mesh);return mesh;
}
makeStrip(0,roadWidth,-0.08,roadMat);
makeStrip(roadWidth/2+0.5,1.0,-0.03,whiteMat);
makeStrip(-roadWidth/2-0.5,1.0,-0.03,whiteMat);
makeStrip(0,0.22,-0.025,mat(0xd7d8d7));

// Kerbs in alternating red and white blocks.
for(let i=0;i<segments;i++){
 if(Math.floor(i/3)%2===0){
  const t=i/segments*Math.PI*2;
  const tangent=new THREE.Vector3(rx*Math.cos(t),0,-rz*Math.sin(t)).normalize();
  const normal=new THREE.Vector3(-tangent.z,0,tangent.x);
  for(const side of [-1,1]){
   const p=new THREE.Vector3(rx*Math.sin(t),0,rz*Math.cos(t))
    .addScaledVector(normal,side*(roadWidth/2+0.8));
   const curb=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.22,0.85),redMat);
   curb.position.set(p.x,0.02,p.z);curb.rotation.y=-t;
   scene.add(curb);
  }
 }
}

// Barriers and posts around the circuit.
for(let i=0;i<segments;i+=2){
 const t=i/segments*Math.PI*2;
 const tangent=new THREE.Vector3(rx*Math.cos(t),0,-rz*Math.sin(t)).normalize();
 const normal=new THREE.Vector3(-tangent.z,0,tangent.x);
 for(const side of [-1,1]){
  const p=new THREE.Vector3(rx*Math.sin(t),0,rz*Math.cos(t))
    .addScaledVector(normal,side*(roadWidth/2+2.2));
  const rail=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.65,0.3),mat(0xb8c1c8));
  rail.position.set(p.x,0.48,p.z);rail.rotation.y=-t;scene.add(rail);
 }
}

// Finish line across the track.
for(let i=0;i<12;i++){
 for(let j=0;j<2;j++){
  const tile=new THREE.Mesh(new THREE.BoxGeometry(roadWidth/12,0.06,0.8),i%2===j?whiteMat:darkMat);
  tile.position.set((i-5.5)*roadWidth/12,0.02,rz+(j-0.5)*0.4);
  scene.add(tile);
 }
}

// Simple trees to give the circuit some depth.
const trunkMat=mat(0x67442b), leavesMat=mat(0x2e6537), leaves2=mat(0x438047);
function tree(x,z,s=1){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.38*s,2.2*s,6),trunkMat);
 trunk.position.set(x,1.1*s,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(1.5*s,3.8*s,7),Math.random()>.5?leavesMat:leaves2);
 crown.position.set(x,3.6*s,z);scene.add(crown);
}
for(let i=0;i<100;i++){
 const t=i/100*Math.PI*2;
 const side=i%2?1:-1;
 const x=(rx+25+Math.random()*55)*Math.sin(t);
 const z=(rz+25+Math.random()*55)*Math.cos(t);
 tree(x,z,0.7+Math.random()*0.7);
}

// Cars are built from simple 3D shapes, no external model download.
function createCar(color){
 const group=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.62,4.2),mat(color,0.35));
 body.position.y=0.7;group.add(body);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.18,1.15),mat(color,0.35));
 hood.position.set(0,1.02,-1.15);group.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.48,0.72,1.75),glassMat);
 cabin.position.set(0,1.22,0.35);group.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.12,1.35),mat(color,0.4));
 roof.position.set(0,1.6,0.4);group.add(roof);
 const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.22,0.35),darkMat);
 bumper.position.set(0,0.48,2.08);group.add(bumper);
 const wheels=[];
 for(const x of [-1.05,1.05])for(const z of [-1.35,1.35]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.28,12),darkMat);
  wheel.rotation.z=Math.PI/2;wheel.position.set(x,0.45,z);group.add(wheel);wheels.push(wheel);
 }
 const lightMat=new THREE.MeshBasicMaterial({color:0xfff3ca});
 for(const x of [-0.65,0.65]){
  const light=new THREE.Mesh(new THREE.BoxGeometry(.35,.17,.08),lightMat);
  light.position.set(x,.78,-2.12);group.add(light);
 }
 group.userData.wheels=wheels;
 scene.add(group);return group;
}
const player=createCar(0xd92724);
const ai=[
 {car:createCar(0x2476d2),t:0.22,speed:0.0057,progress:0.22},
 {car:createCar(0xf2c230),t:0.34,speed:0.0055,progress:0.34},
 {car:createCar(0xeeeeee),t:0.46,speed:0.0059,progress:0.46}
];
const startT=0;
function trackPos(t,offset=0){
 const x=rx*Math.sin(t),z=rz*Math.cos(t);
 const tangent=new THREE.Vector3(rx*Math.cos(t),0,-rz*Math.sin(t)).normalize();
 const normal=new THREE.Vector3(-tangent.z,0,tangent.x);
 return new THREE.Vector3(x,0,z).addScaledVector(normal,offset);
}
function placeCar(car,t,offset=0){
 const p=trackPos(t,offset);
 car.position.set(p.x,0,p.z);
 car.rotation.y=Math.atan2(rx*Math.cos(t),rz*Math.sin(t));
 // Orient the car's nose toward the direction of travel.
 car.rotation.y=Math.atan2(rx*Math.cos(t),-rz*Math.sin(t));
}
placeCar(player,0,0);
ai.forEach((a,i)=>placeCar(a.car,a.t,(i-1)*3));

const keys={left:false,right:false,gas:false,brake:false};
let running=false,finished=false,speed=0,heading=Math.PI/2;
let elapsed=0,lap=1,previousAngle=0,totalProgress=0;
const maxSpeed=42,acceleration=19;
const message=document.getElementById('message');
const speedEl=document.getElementById('speed');
const lapEl=document.getElementById('lap');
const posEl=document.getElementById('position');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function normAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a< -Math.PI)a+=Math.PI*2;return a;}

function startGame(){
 speed=0;heading=Math.PI/2;elapsed=0;lap=1;totalProgress=0;previousAngle=0;
 finished=false;running=true;
 player.position.set(0,0,rz);player.rotation.y=heading;
 ai.forEach((a,i)=>{a.t=0.16+i*0.11;a.progress=a.t/(Math.PI*2);placeCar(a.car,a.t,(i-1)*3);});
 message.style.display='none';
}
document.getElementById('start').addEventListener('click',startGame);
document.querySelectorAll('[data-control]').forEach(btn=>{
 const k=btn.dataset.control;
 const down=e=>{e.preventDefault();keys[k]=true;};
 const up=e=>{e.preventDefault();keys[k]=false;};
 btn.addEventListener('pointerdown',down);
 btn.addEventListener('pointerup',up);
 btn.addEventListener('pointercancel',up);
 btn.addEventListener('pointerleave',up);
});
addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.gas=true;
 if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.brake=true;
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.gas=false;
 if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.brake=false;
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
});
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

const clock=new THREE.Clock();
function update(dt){
 if(!running)return;
 elapsed+=dt;
 if(keys.gas)speed+=acceleration*dt;
 else speed-=7*dt;
 if(keys.brake)speed-=26*dt;
 speed=clamp(speed,0,maxSpeed);
 const steering=(keys.right?1:0)-(keys.left?1:0);
 if(speed>0.3)heading-=steering*1.8*dt*(0.25+speed/maxSpeed);
 player.rotation.y=heading;
 const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 player.position.addScaledVector(forward,speed*dt);
 player.userData.wheels.forEach(w=>w.rotation.x+=speed*dt*0.6);

 // Keep the car on the course with a gentle grass slowdown.
 const ellipse=(player.position.x/rx)**2+(player.position.z/rz)**2;
 if(ellipse>1.43)speed*=0.985;

 // Track progress for lap and position display.
 let angle=Math.atan2(player.position.x/rx,player.position.z/rz);
 let delta=normAngle(angle-previousAngle);
 if(Math.abs(delta)<0.25)totalProgress+=delta;
 previousAngle=angle;
 lap=clamp(Math.floor(Math.max(0,totalProgress)/(Math.PI*2))+1,1,3);
 if(totalProgress>=Math.PI*6){
  running=false;finished=true;
  message.innerHTML='<h1>FINISH!</h1><p>Waktu balapan: '+elapsed.toFixed(1)+' detik.<br>Tekan tombol untuk balapan lagi.</p><button id="restart">BALAP LAGI</button>';
  message.style.display='block';
  document.getElementById('restart').onclick=startGame;
 }
 // AI follows the oval at steady speeds.
 ai.forEach(a=>{
  if(running){a.t+=a.speed*dt*10;a.progress=a.t/(Math.PI*2);}
  placeCar(a.car,a.t,0);
 });
 const playerScore=totalProgress/(Math.PI*2);
 const scores=[playerScore,...ai.map(a=>a.progress)].sort((a,b)=>b-a);
 posEl.textContent=(scores.findIndex(v=>v===playerScore)+1)+'/4';
 lapEl.textContent=Math.min(lap,3)+'/3';
 speedEl.textContent=Math.round(speed*4.2);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.04);
 update(dt);
 const behind=new THREE.Vector3(-Math.sin(heading)*10,5.3,-Math.cos(heading)*10);
 const target=player.position.clone().add(behind);
 camera.position.lerp(target,0.10);
 camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
</body>
</html>
