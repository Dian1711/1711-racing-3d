
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1711 Racing 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111820;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:12px;gap:8px}
.panel{background:#101820dc;border:1px solid #ffffff26;border-radius:12px;padding:10px}
.brand{font-weight:900;font-size:18px;letter-spacing:1px}
.brand span{color:#ff5b35}
.small{font-size:11px;color:#b8c6d3;margin-top:4px}
.stats{display:flex;gap:5px;text-align:center}
.stat strong{display:block;font-size:19px}
.stat span{font-size:10px;color:#b8c6d3}
#speed{color:#ffcb65;font-size:24px}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:min(90%,370px);padding:20px;background:#101820ed;border:1px solid #ffffff35;border-radius:16px;text-align:center;pointer-events:auto}
#message h1{font-size:25px;margin:0 0 8px}
#message p{color:#cbd5e1;font-size:13px;line-height:1.5}
button{border:0;border-radius:10px;background:#ff5b35;color:white;font-weight:800;padding:12px;cursor:pointer;touch-action:none}
#message button{width:100%;margin-top:8px}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.controlgroup{display:flex;gap:7px;pointer-events:auto}
.ctrl{width:54px;height:56px;border-radius:15px;background:#18232ddd;border:1px solid #ffffff55;font-size:21px;user-select:none}
.ctrl.gas{background:#dc492bde}
.ctrl.brake{background:#394b60e8;font-size:11px}
.ctrl.reverse{background:#7851a9;font-size:11px}
#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffa8;white-space:nowrap}
.ctrl.nitro{background:#1685c7;font-size:11px}
#nitroWrap{position:absolute;top:82px;right:12px;width:118px;background:#101820dc;border:1px solid #ffffff26;border-radius:9px;padding:6px}
#nitroLabel{font-size:10px;font-weight:800;margin-bottom:5px;color:#7bd7ff}
#nitroTrack{height:7px;background:#334155;border-radius:8px;overflow:hidden}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#16b8ff,#b6f2ff);transition:width .08s}
@media(max-width:520px){
 .topbar{padding:7px;gap:4px}
 .panel{padding:7px}
 .brand{font-size:13px}
 .small{font-size:9px}
 .stats{gap:3px}
 .stat strong{font-size:15px}
 .stat span{font-size:8px}
 #speed{font-size:18px}
 .ctrl{width:45px;height:50px}
 #controls{padding:0 7px;bottom:19px}
 #nitroWrap{top:66px;right:7px;width:95px}
 .ctrl.nitro{font-size:10px}
 #nitroWrap{top:66px;right:7px;width:95px}
 .ctrl.nitro{font-size:10px}
 #nitroWrap{top:66px;right:7px;width:95px}
 .ctrl.nitro{font-size:10px}
 #message{top:22%;padding:15px}
}
</style>
</head>
<body>
<div id="hud">
  <div class="topbar">
    <div class="panel">
      <div class="brand">1711 <span>RACING</span></div>
      <div class="small">3D CIRCUIT</div>
    </div>
    <div class="stats">
      <div class="panel stat"><strong id="position">4/4</strong><span>POSISI</span></div>
      <div class="panel stat"><strong id="lap">1/3</strong><span>PUTARAN</span></div>
      <div class="panel stat"><strong id="speed">0</strong><span>KM/J</span></div>
    </div>
  </div>

  <div id="message">
    <h1>1711 RACING 3D</h1>
    <p>Kalahkan 3 pembalap AI! Selesaikan 3 putaran dan jadilah yang pertama mencapai garis finis.</p>
    <button id="start">MULAI BALAPAN</button>
    <p>W / ↑ Gas · S Mundur · ↓ Rem · A/D Belok · Shift / X Nitro</p>
  </div>

  <div id="nitroWrap"><div id="nitroLabel">⚡ NITRO <span id="nitroPct">100%</span></div><div id="nitroTrack"><div id="nitroFill"></div></div></div>
  <div id="controls">
    <div class="controlgroup">
      <button class="ctrl" data-control="left">◀</button>
      <button class="ctrl" data-control="right">▶</button>
    </div>
    <div class="controlgroup">
      <button class="ctrl reverse" data-control="reverse">MUNDUR</button>
      <button class="ctrl brake" data-control="brake">REM</button>
      <button class="ctrl nitro" data-control="nitro">NITRO</button>
      <button class="ctrl gas" data-control="gas">▲</button>
    </div>
  </div>
  <div id="hint">Ikuti lintasan dan hindari rumput!</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5df);
scene.fog=new THREE.Fog(0x9bc5df,170,430);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));

scene.add(new THREE.HemisphereLight(0xe3f3ff,0x4d6345,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-80,120,50);
scene.add(sun);

const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grassMat=mat(0x477b3d);
const roadMat=mat(0x343b43);
const whiteMat=mat(0xffffff);
const redMat=mat(0xf3442e);
const darkMat=mat(0x20252b);
const glassMat=mat(0x8fc8df,.35);

const nitroGlowMat=new THREE.MeshBasicMaterial({color:0x168dff,transparent:true,opacity:.98});
const nitroRedMat=new THREE.MeshBasicMaterial({color:0xff2518,transparent:true,opacity:.96});
const nitroOrangeMat=new THREE.MeshBasicMaterial({color:0xff8a16,transparent:true,opacity:.98});

// Tekstur aspal dibuat secara prosedural agar jalan tidak tampak polos seperti balok.
function makeAsphaltTexture(){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=512;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#34383d';ctx.fillRect(0,0,512,512);
 for(let i=0;i<18000;i++){
  const v=35+Math.random()*65;
  ctx.fillStyle='rgba('+v+','+v+','+v+','+(Math.random()*.22)+')';
  const size=Math.random()*2.2+.3;
  ctx.fillRect(Math.random()*512,Math.random()*512,size,size);
 }
 for(let i=0;i<95;i++){
  ctx.strokeStyle='rgba(10,12,14,'+(Math.random()*.12)+')';
  ctx.lineWidth=Math.random()*1.4+.3;
  ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);
  ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke();
 }
 const tex=new THREE.CanvasTexture(canvas);
 tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
 tex.repeat.set(80,2);tex.colorSpace=THREE.SRGBColorSpace;
 return tex;
}
roadMat.map=makeAsphaltTexture();
roadMat.color.set(0xffffff);


const RX=92,RZ=62,ROAD=17,SEG=260,TAU=Math.PI*2;

const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.25;
scene.add(ground);

function trackPoint(t){
 return new THREE.Vector3(RX*Math.sin(t),0,RZ*Math.cos(t));
}
function trackTangent(t){
 return new THREE.Vector3(RX*Math.cos(t),0,-RZ*Math.sin(t)).normalize();
}
function trackNormal(t){
 const d=trackTangent(t);
 return new THREE.Vector3(-d.z,0,d.x);
}
function wrap(t){return ((t%TAU)+TAU)%TAU}
function angleDifference(a,b){
 return ((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI;
}
function trackAngle(p){return Math.atan2(p.x/RX,p.z/RZ)}
function trackDistance(p){
 const q=Math.sqrt((p.x/RX)**2+(p.z/RZ)**2);
 return Math.abs(q-1)*Math.min(RX,RZ);
}

function makeStrip(offset,width,y,material){
 const vertices=[],indices=[];
 for(let i=0;i<=SEG;i++){
  const t=i/SEG*TAU;
  const p=trackPoint(t);
  const n=trackNormal(t);
  const c=p.clone().addScaledVector(n,offset);
  const a=c.clone().addScaledVector(n,-width/2);
  const b=c.clone().addScaledVector(n,width/2);
  vertices.push(a.x,y,a.z,b.x,y,b.z);
  if(i<SEG){
   const k=i*2;
   indices.push(k,k+1,k+2,k+1,k+3,k+2);
  }
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
 g.setIndex(indices);
 g.computeVertexNormals();
 scene.add(new THREE.Mesh(g,material));
}

makeStrip(0,ROAD,-.08,roadMat);
makeStrip(ROAD/2+.5,1,-.03,whiteMat);
makeStrip(-ROAD/2-.5,1,-.03,whiteMat);
makeStrip(0,.2,-.025,mat(0xd7d8d7));

for(let i=0;i<SEG;i++){
 const t=i/SEG*TAU;
 const p=trackPoint(t),n=trackNormal(t);
 if(Math.floor(i/3)%2===0){
  for(const side of [-1,1]){
   const c=p.clone().addScaledVector(n,side*(ROAD/2+.8));
   const curb=new THREE.Mesh(new THREE.BoxGeometry(2.2,.22,.85),redMat);
   curb.position.set(c.x,.02,c.z);
   curb.rotation.y=Math.atan2(trackTangent(t).x,trackTangent(t).z);
   scene.add(curb);
  }
 }
 if(i%2===0){
  for(const side of [-1,1]){
   const c=p.clone().addScaledVector(n,side*(ROAD/2+2.2));
   const rail=new THREE.Mesh(new THREE.BoxGeometry(2.3,.65,.3),mat(0xb8c1c8));
   rail.position.set(c.x,.48,c.z);
   rail.rotation.y=Math.atan2(trackTangent(t).x,trackTangent(t).z);
   scene.add(rail);
  }
 }
}

// Garis start dan finis.
for(let i=0;i<12;i++){
 for(let j=0;j<2;j++){
  const tile=new THREE.Mesh(
   new THREE.BoxGeometry(ROAD/12,.06,.8),
   (i+j)%2===0?whiteMat:darkMat
  );
  tile.position.set((i-5.5)*ROAD/12,.02,RZ+(j-.5)*.4);
  scene.add(tile);
 }
}

const trunkMat=mat(0x67442b);
const leavesMat=mat(0x2e6537);
const leaves2=mat(0x438047);

function tree(x,z,s){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.38*s,2.2*s,6),trunkMat);
 trunk.position.set(x,1.1*s,z);
 scene.add(trunk);
 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(1.5*s,3.8*s,7),
  Math.random()>.5?leavesMat:leaves2
 );
 crown.position.set(x,3.6*s,z);
 scene.add(crown);
}

for(let i=0;i<100;i++){
 const t=i/100*TAU;
 const x=(RX+25+Math.random()*55)*Math.sin(t);
 const z=(RZ+25+Math.random()*55)*Math.cos(t);
 tree(x,z,.7+Math.random()*.7);
}

// Pegunungan rendah di kejauhan untuk memberi kedalaman.
const mountainMat=mat(0x718c96);
for(let i=0;i<34;i++){
 const t=i/34*TAU;
 const radius=235+Math.random()*75;
 const h=18+Math.random()*38;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(15+Math.random()*16,h,5),
  mountainMat
 );
 mountain.position.set(Math.sin(t)*radius,h/2-2,Math.cos(t)*radius);
 mountain.rotation.y=Math.random()*Math.PI;
 scene.add(mountain);
}

// Lampu jalan di sisi lintasan.
const poleMat=mat(0x454d54);
const lampGlow=new THREE.MeshBasicMaterial({color:0xffedb5});
for(let i=0;i<20;i++){
 const t=i/20*TAU;
 const p=trackPoint(t);
 const n=trackNormal(t);
 const side=i%2===0?1:-1;
 const base=p.clone().addScaledVector(n,side*(ROAD/2+5.5));
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,5.8,6),poleMat);
 pole.position.set(base.x,2.9,base.z);scene.add(pole);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,1.2),poleMat);
 arm.position.set(base.x-side*.48,5.65,base.z);scene.add(arm);
 const lamp=new THREE.Mesh(new THREE.BoxGeometry(.55,.16,.38),lampGlow);
 lamp.position.set(base.x-side*.9,5.58,base.z);scene.add(lamp);
}

// Papan iklan balap di sekitar sirkuit.
for(let i=0;i<6;i++){
 const t=(i/6)*TAU+.25;
 const p=trackPoint(t);
 const n=trackNormal(t);
 const side=i%2===0?1:-1;
 const base=p.clone().addScaledVector(n,side*(ROAD/2+7));
 const postMat=mat(0x424950);
 const boardMat=mat(i%2===0?0xff5b35:0x183c58);
 for(const x of [-1.6,1.6]){
  const post=new THREE.Mesh(new THREE.BoxGeometry(.14,2.4,.14),postMat);
  post.position.set(base.x+x,1.2,base.z);scene.add(post);
 }
 const board=new THREE.Mesh(new THREE.BoxGeometry(3.6,1.2,.18),boardMat);
 board.position.set(base.x,2.55,base.z);scene.add(board);
 const sign=new THREE.Mesh(new THREE.BoxGeometry(2.7,.15,.20),whiteMat);
 sign.position.set(base.x,2.55,base.z-.11);scene.add(sign);
}

function createCar(color){
 const g=new THREE.Group();
 const paint=new THREE.MeshStandardMaterial({color,roughness:.28,metalness:.2});
 const dark=mat(0x15191e,.42),rubber=mat(0x101113,.94);
 const rim=new THREE.MeshStandardMaterial({color:0xc7cdd2,metalness:.72,roughness:.3});
 const glass=new THREE.MeshStandardMaterial({color:0x102a3b,metalness:.18,roughness:.22});
 const white=mat(0xf5f0e5,.35);
 const add=(geo,material,pos,scale,rot)=>{
  const m=new THREE.Mesh(geo,material);m.position.set(...pos);
  if(scale)m.scale.set(...scale);if(rot)m.rotation.set(...rot);
  m.castShadow=true;m.receiveShadow=true;g.add(m);return m;
 };
 // Formula-style low monocoque chassis, with the pointed nose facing local -Z.
 add(new THREE.BoxGeometry(1.05,.30,2.65),paint,[0,.48,.02]);
 // Hidung panjang berbentuk baji, dibuat dari penampang simetris kiri-kanan.
 // Semua penampang memakai sumbu tengah yang sama agar ujung tidak miring.
 const noseSections=[
  {z:-.55,w:.39,b:.37,t:.62},
  {z:-1.60,w:.34,b:.37,t:.60},
  {z:-2.65,w:.20,b:.40,t:.55},
  {z:-3.72,w:.018,b:.475,t:.49}
 ];
 const noseVertices=[],noseIndices=[];
 for(const s of noseSections){
  noseVertices.push(-s.w,s.b,s.z, s.w,s.b,s.z, -s.w,s.t,s.z, s.w,s.t,s.z);
 }
 for(let i=0;i<noseSections.length-1;i++){
  const a=i*4,b=a+4;
  // sisi kiri, sisi kanan, permukaan atas dan bawah; pola identik di kedua sisi.
  noseIndices.push(a,a+2,b, a+2,b+2,b);
  noseIndices.push(a+1,b+1,a+3, a+3,b+1,b+3);
  noseIndices.push(a+2,a+3,b+2, a+3,b+3,b+2);
  noseIndices.push(a,b,a+1, a+1,b,a+1+4);
 }
 const noseGeo=new THREE.BufferGeometry();
 noseGeo.setAttribute('position',new THREE.Float32BufferAttribute(noseVertices,3));
 noseGeo.setIndex(noseIndices);noseGeo.computeVertexNormals();
 add(noseGeo,paint,[0,0,0]);
 // Lapisan atas yang menyambung ke monocoque tanpa mengubah garis tengah.
 add(new THREE.BoxGeometry(.78,.16,1.22),paint,[0,.49,-.82]);
 add(new THREE.BoxGeometry(2.48,.10,.36),dark,[0,.31,-3.48]);
 add(new THREE.BoxGeometry(2.30,.045,.23),paint,[0,.375,-3.48]);
 // Endplate sayap depan dibuat berpasangan dengan jarak yang sama dari garis tengah.
 for(const x of [-1.08,1.08]){
  add(new THREE.BoxGeometry(.07,.23,.30),paint,[x,.43,-3.48]);
 }
 // Side pods and aerodynamic floor.
 for(const x of [-.72,.72]){
  add(new THREE.BoxGeometry(.48,.34,1.25),paint,[x,.48,.10]);
  add(new THREE.BoxGeometry(.54,.10,1.55),dark,[x,.31,.08]);
  // Small upper pod accents.
  add(new THREE.BoxGeometry(.30,.052,.94),white,[x,.665,.10]);
  add(new THREE.BoxGeometry(.12,.025,.72),dark,[x,.697,.08]);
 }
 // Raised, compact cockpit and driver helmet.
 add(new THREE.BoxGeometry(.72,.24,.78),dark,[0,.66,.28]);
 add(new THREE.BoxGeometry(.48,.16,.46),glass,[0,.79,.24]);
 const helmetMat=mat(0xffd447,.32);
 add(new THREE.SphereGeometry(.19,16,12),helmetMat,[0,.91,.25]);
 add(new THREE.BoxGeometry(.30,.065,.08),dark,[0,.92,.08]);
 // Rear engine cover, intake, and raised rear bumper/aero hoop above the cover.
 add(new THREE.BoxGeometry(.82,.40,.82),paint,[0,.63,.88]);
 add(new THREE.BoxGeometry(.34,.25,.28),dark,[0,.94,.78]);
 // Bemper belakang ditinggikan dan diperkuat di atas kap mesin.
 add(new THREE.BoxGeometry(1.22,.12,.20),dark,[0,1.12,1.02]);
 add(new THREE.BoxGeometry(1.04,.055,.13),white,[0,1.19,1.02]);
 for(const x of [-.51,.51]){
  add(new THREE.BoxGeometry(.10,.30,.12),paint,[x,.99,1.02]);
 }
 // Behel belakang lebar tetapi rendah dan menyatu dengan gaya mobil balap.
 const behelAccent=mat(0xf3442e,.32);
 for(const x of [-.52,.52]){
  add(new THREE.BoxGeometry(.075,.27,.075),dark,[x,1.00,.76]);
  add(new THREE.BoxGeometry(.032,.22,.035),behelAccent,[x,1.01,.716]);
 }
 add(new THREE.BoxGeometry(1.18,.075,.075),dark,[0,1.14,.76]);
 add(new THREE.BoxGeometry(.94,.022,.025),behelAccent,[0,1.185,.716]);
 // Sirip aerodinamis tengah (shark fin) mengalir dari kokpit ke sayap belakang.
 const finShape=new THREE.Shape();
 finShape.moveTo(-.48,.02);
 finShape.lineTo(.48,.02);
 finShape.lineTo(.23,.58);
 finShape.lineTo(-.20,.72);
 finShape.lineTo(-.48,.02);
 const finGeo=new THREE.ExtrudeGeometry(finShape,{depth:.055,bevelEnabled:false});
 finGeo.rotateY(Math.PI/2);
 const fin=new THREE.Mesh(finGeo,paint);
 fin.position.set(-.027,.70,.48);
 fin.castShadow=true;fin.receiveShadow=true;g.add(fin);
 // Kontras warna di sisi sirip agar lekuk aerodinamis terlihat.
 add(new THREE.BoxGeometry(.035,.06,.42),white,[-.065,1.02,.77]);
 // Rear wing with two supports.
 for(const x of [-.56,.56])add(new THREE.BoxGeometry(.09,.38,.10),dark,[x,.66,1.42]);
 add(new THREE.BoxGeometry(1.95,.10,.34),dark,[0,.88,1.48]);
 add(new THREE.BoxGeometry(1.80,.035,.24),paint,[0,.945,1.48]);
 // Corak balap tambahan: garis ganda di hidung, aksen sisi, dan panel belakang.
 for(const x of [-.16,.16]){
  add(new THREE.BoxGeometry(.075,.018,2.92),white,[x,.595,-2.02]);
 }
 add(new THREE.BoxGeometry(.12,.018,.60),white,[0,.715,.88]);
 for(const x of [-.965,.965]){
  add(new THREE.BoxGeometry(.035,.12,.78),white,[x,.51,.08]);
  add(new THREE.BoxGeometry(.04,.055,.48),paint,[x*1.005,.59,-.18]);
  add(new THREE.BoxGeometry(.04,.055,.40),white,[x*1.005,.59,.56]);
 }
 add(new THREE.BoxGeometry(.62,.025,.10),white,[0,.72,1.12]);
 // Four exposed racing tyres, placed outside the chassis.
 const wheels=[];
 for(const x of [-1.02,1.02])for(const z of [-1.25,1.18]){
  // Pivot terpisah untuk setir; putaran ban tidak lagi bercampur dengan sudut belok.
  const steeringPivot=new THREE.Group();
  steeringPivot.position.set(x,.36,z);
  const w=new THREE.Group();
  steeringPivot.add(w);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.30,32),rubber);
  tire.rotation.z=Math.PI/2;w.add(tire);
  const rimMesh=new THREE.Mesh(new THREE.CylinderGeometry(.235,.235,.315,24),rim);
  rimMesh.rotation.z=Math.PI/2;w.add(rimMesh);
  // Velg kontras dengan penanda warna besar agar rotasi ban terlihat jelas.
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.205,.026,7,24),white);
  ring.rotation.y=Math.PI/2;w.add(ring);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.33,16),dark);
  hub.rotation.z=Math.PI/2;w.add(hub);
  const spokeAccent=mat(0xff5b35,.4);
  for(let k=0;k<6;k++){
   const angle=k*Math.PI/3;
   const spoke=new THREE.Mesh(new THREE.BoxGeometry(.055,.035,.30),k%2===0?spokeAccent:white);
   spoke.position.y=Math.sin(angle)*.135;
   spoke.position.z=Math.cos(angle)*.135;
   spoke.rotation.x=angle;
   w.add(spoke);
  }
  // Satu tanda warna di sisi velg jadi penunjuk visual saat roda berputar.
  const marker=new THREE.Mesh(new THREE.BoxGeometry(.035,.075,.09),spokeAccent);
  marker.position.set(0,.19,.07);w.add(marker);
  w.position.set(0,0,0);
  w.children.forEach(o=>{o.castShadow=true;o.receiveShadow=true;});
  g.add(steeringPivot);
  wheels.push({wheel:w,pivot:steeringPivot,front:z<0});
 }
 // Visible suspension arms between the chassis and the exposed wheels.
 for(const x of [-1,1]){
  for(const z of [-1.18,1.08]){

let audioContext=null,engineOsc=null,engineOsc2=null,engineOsc3=null,nitroOsc=null,nitroNoise=null;
let engineGain=null,engineGain2=null,engineGain3=null,nitroGain=null,engineFilter=null,nitroFilter=null;
let engineRPM=0,nitroRocketPitch=0;

function initAudio(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!audioContext){
   audioContext=new AudioCtx();

   engineFilter=audioContext.createBiquadFilter();
   engineFilter.type='lowpass';
   engineFilter.frequency.value=520;
   engineFilter.Q.value=2.2;
   engineGain=audioContext.createGain();
   engineGain.gain.value=0;
   engineOsc=audioContext.createOscillator();
   engineOsc.type='sawtooth';
   engineOsc.frequency.value=38;
   engineOsc.connect(engineFilter);
   engineFilter.connect(engineGain);
   engineGain.connect(audioContext.destination);
   engineOsc.start();

   const bassFilter=audioContext.createBiquadFilter();
   bassFilter.type='lowpass';
   bassFilter.frequency.value=280;
   engineGain2=audioContext.createGain();
   engineGain2.gain.value=0;
   engineOsc2=audioContext.createOscillator();
   engineOsc2.type='sawtooth';
   engineOsc2.detune.value=-7;
   engineOsc2.frequency.value=54;
   engineOsc2.connect(bassFilter);
   bassFilter.connect(engineGain2);
   engineGain2.connect(audioContext.destination);
   engineOsc2.start();

   engineGain3=audioContext.createGain();
   engineGain3.gain.value=0;
   engineOsc3=audioContext.createOscillator();
   engineOsc3.type='triangle';
   engineOsc3.detune.value=5;
   engineOsc3.frequency.value=80;
   engineOsc3.connect(engineGain3);
   engineGain3.connect(audioContext.destination);
   engineOsc3.start();

   // Lapisan roket: dentuman rendah + desis lebar yang naik bersama kecepatan nitro.
   nitroFilter=audioContext.createBiquadFilter();
   nitroFilter.type='lowpass';
   nitroFilter.frequency.value=1000;
   nitroFilter.Q.value=.65;
   nitroGain=audioContext.createGain();
   nitroGain.gain.value=0;
   nitroOsc=audioContext.createOscillator();
   nitroOsc.type='sawtooth';
   nitroOsc.frequency.value=40;
   nitroOsc.connect(nitroFilter);
   nitroFilter.connect(nitroGain);
   nitroGain.connect(audioContext.destination);
   nitroOsc.start();

   const bufferSize=2*audioContext.sampleRate;
   const noiseBuffer=audioContext.createBuffer(1,bufferSize,audioContext.sampleRate);
   const noiseData=noiseBuffer.getChannelData(0);
   for(let i=0;i<bufferSize;i++)noiseData[i]=Math.random()*2-1;
   nitroNoise=audioContext.createBufferSource();
   nitroNoise.buffer=noiseBuffer;
   nitroNoise.loop=true;
   const noiseFilter=audioContext.createBiquadFilter();
   noiseFilter.type='bandpass';
   noiseFilter.frequency.value=1200;
   noiseFilter.Q.value=.4;
   const noiseGain=audioContext.createGain();
   noiseGain.gain.value=0;
   nitroNoise.connect(noiseFilter);
   noiseFilter.connect(noiseGain);
   noiseGain.connect(audioContext.destination);
   nitroNoise.start();
   nitroGain.noiseGain=noiseGain;
   nitroGain.noiseFilter=noiseFilter;
  }
  if(audioContext.state==='suspended')audioContext.resume();
 }catch(err){}
}

function updateSound(dt=1/60){
 if(!audioContext||!engineOsc||audioContext.state!=='running')return;
 const now=audioContext.currentTime;
 const speedRatio=Math.min(1,Math.abs(speed)/MAX_SPEED);
 const throttle=running&&keys.gas&&!keys.reverse;
 // RPM mengikuti kecepatan aktual; throttle memberi sedikit raungan ekstra saat akselerasi.
 const rpmTarget=running?Math.min(1,(speedRatio*.82)+(throttle?.18:0)+(nitroActive?.12:0)):0;
 engineRPM+=(rpmTarget-engineRPM)*(1-Math.exp(-dt*(throttle?1.35:1.8)));
 const rpm=.05+engineRPM*.95;
 const baseFreq=35+rpm*128+(nitroActive?12:0);

 engineOsc.frequency.setTargetAtTime(baseFreq,now,.12);
 engineOsc2.frequency.setTargetAtTime(baseFreq*1.36,now,.14);
 engineOsc3.frequency.setTargetAtTime(baseFreq*1.92,now,.15);
 engineFilter.frequency.setTargetAtTime(300+rpm*1450,now,.15);
 engineGain.gain.setTargetAtTime(running?.026+rpm*.052:0,now,.15);
 engineGain2.gain.setTargetAtTime(running?.018+rpm*.028:0,now,.16);
 engineGain3.gain.setTargetAtTime(running?.003+rpm*.012:0,now,.16);

 const rocket=running&&nitroActive;
 if(rocket)nitroRocketPitch=Math.min(1,nitroRocketPitch+dt*.48);
 else nitroRocketPitch=Math.max(0,nitroRocketPitch-dt*.9);
 const rocketPitch=nitroRocketPitch;
 nitroOsc.frequency.setTargetAtTime(rocket?38+rocketPitch*175:38,now,.12);
 nitroFilter.frequency.setTargetAtTime(rocket?550+rocketPitch*3300:450,now,.12);
 nitroGain.gain.setTargetAtTime(rocket?.035+rocketPitch*.04:0,now,.12);
 if(nitroGain.noiseGain){
  nitroGain.noiseFilter.frequency.setTargetAtTime(rocket?650+rocketPitch*4000:550,now,.12);
  nitroGain.noiseGain.gain.setTargetAtTime(rocket?.012+rocketPitch*.045:0,now,.12);
 }
}

function finishRace(winner){
 if(raceOver)return;
 raceOver=true;
 running=false;

 const won=winner==='Kamu';
 message.innerHTML=
  '<h1>'+(won?'🏆 KAMU MENANG!':'BALAPAN SELESAI')+'</h1>'+
  '<p>'+(won?'Hebat! Kamu mencapai garis finis pertama.':
  winner+' lebih dulu mencapai garis finis.')+
  '<br>Waktu balapan: '+elapsed.toFixed(1)+' detik.</p>'+
  '<button id="restart">BALAP LAGI</button>';

 message.style.display='block';
 document.getElementById('restart').addEventListener('click',startGame);
}

function startGame(){
 initAudio();
 speed=0;
 nitro=100;nitroActive=false;
 heading=Math.PI/2;
 steeringInput=0;
 playerProgress=0;
 lastAngle=0;
 elapsed=0;
 running=true;
 playerFinished=false;
 raceOver=false;

 player.position.set(-900,0,0);
 heading=Math.PI/2;
 player.rotation.y=heading+Math.PI;

 ai.forEach((a,i)=>{
  a.car.visible=false;
  a.progress=[.13,.25,.37][i];
  a.speed=[.31,.34,.32][i];
  a.lane=[-3,0,3][i];
  a.targetLane=a.lane;
  a.finished=false;
  placeCar(a.car,a.progress,a.lane);
 });

 Object.keys(keys).forEach(k=>keys[k]=false);
 message.style.display='none';
 updateHUD();
}

document.getElementById('start').addEventListener('click',startGame);

// Tombol layar sentuh.
document.querySelectorAll('[data-control]').forEach(btn=>{
 const key=btn.dataset.control;

 const down=e=>{
  e.preventDefault();
  keys[key]=true;
  try{btn.setPointerCapture(e.pointerId)}catch{}
 };
 const up=e=>{
  e.preventDefault();
  keys[key]=false;
 };

 btn.addEventListener('pointerdown',down);
 btn.addEventListener('pointerup',up);
 btn.addEventListener('pointercancel',up);
 btn.addEventListener('lostpointercapture',()=>keys[key]=false);
 btn.addEventListener('contextmenu',e=>e.preventDefault());
});

// Keyboard: S khusus mundur, panah bawah khusus rem.
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();

 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){
  e.preventDefault();
 }

 if(k==='arrowup'||k==='w')keys.gas=true;
 if(k==='arrowdown')keys.brake=true;
 if(k==='s')keys.reverse=true;
 if(k==='arrowleft'||k==='a')keys.left=true;
 if(k==='arrowright'||k==='d')keys.right=true;
 if(k==='shift'||k==='x')keys.nitro=true;
});

addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();

 if(k==='arrowup'||k==='w')keys.gas=false;
 if(k==='arrowdown')keys.brake=false;
 if(k==='s')keys.reverse=false;
 if(k==='arrowleft'||k==='a')keys.left=false;
 if(k==='arrowright'||k==='d')keys.right=false;
 if(k==='shift'||k==='x')keys.nitro=false;
});

addEventListener('blur',()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

function updatePlayer(dt){
 // Gas dan mundur tidak aktif bersamaan.
 if(keys.gas&&!keys.reverse){
  // Di bawah 60 km/jam, kenaikan lebih halus dan lambat; setelah itu akselerasi tetap bertahap.
  const lowSpeedFactor=Math.abs(speed)<(60/2.25)?1.25:1;
  speed+=8.5*lowSpeedFactor*dt;
 }else if(keys.reverse&&!keys.gas){
  speed-=12*dt;
 }else if(!keys.brake){
  speed*=Math.exp(-.11*dt);
 }

 // Rem memperlambat kecepatan menuju nol, bukan langsung mundur.
 if(keys.brake){
  if(speed>0)speed=Math.max(0,speed-7*dt);
  else if(speed<0)speed=Math.min(0,speed+7*dt);
 }

 nitroActive=keys.nitro&&keys.gas&&nitro>0&&speed>2;
 if(nitroActive){
  nitro=Math.max(0,nitro-24*dt);
  speed+=11*dt;
 }else{
  nitro=Math.min(100,nitro+8*dt);
 }
 // Batas nitro tidak langsung memotong kecepatan saat tombol dilepas.
 // Mobil melambat secara alami kembali ke batas normal.
 speed=THREE.MathUtils.clamp(speed,-MAX_REVERSE,NITRO_SPEED);
 player.userData.nitroFlames.forEach(f=>{f.visible=nitroActive; if(nitroActive)f.scale.setScalar(.75+Math.random()*.7);});

 const steering=(keys.right?1:0)-(keys.left?1:0);
 const speedFraction=Math.min(1,Math.abs(speed)/MAX_SPEED);
 // Input setir naik/turun secara bertahap agar mobil tidak langsung menyentak.
 const steeringSmooth=1-Math.exp(-dt*3.2);
 steeringInput+=(steering-steeringInput)*steeringSmooth;
 if(Math.abs(speed)>.3){
  const reverseFactor=speed>=0?1:-1;
  const turnRate=1.35;
  const steeringResponse=0.28+speedFraction*0.72;
  heading-=steeringInput*turnRate*dt*steeringResponse*reverseFactor;
 }
 // Body roll ringan dan lembut mengikuti setir yang sudah dihaluskan.
 const targetRoll=-steeringInput*speedFraction*0.035;
 player.rotation.z+=(targetRoll-player.rotation.z)*(1-Math.exp(-dt*3.2));
 player.rotation.y=heading+Math.PI;
 player.position.addScaledVector(forwardFromHeading(heading),speed*dt);
 // Putaran roda dibuat terbaca, tidak terlalu cepat hingga terlihat seperti roda polos.
 const wheelSpin=speed*dt*.42;
 player.userData.wheels.forEach(w=>{
  // Putaran ban dan arah setir memakai sumbu terpisah agar ban tetap stabil.
  w.wheel.rotation.x+=wheelSpin;
  w.pivot.rotation.y=w.front? -steeringInput*.48:0;
 });


 // Tepi jalan tidak memantulkan mobil: tetap di tepi, lalu belokkan arah secara perlahan ke dalam.
 edgeCollisionCooldown=Math.max(0,edgeCollisionCooldown-dt);
 const safeEdge=11.35;
 if(player.position.z>safeEdge){
  player.position.z=safeEdge;
  if(speed*Math.cos(heading)>0){
   const inwardHeading=Math.atan2(Math.sin(heading),-Math.max(.12,Math.abs(Math.cos(heading))));
   heading+=angleDifference(inwardHeading,heading)*Math.min(1,dt*2.2);
   speed*=Math.exp(-.16*dt);
   steeringInput*=Math.exp(-1.8*dt);
   nitroActive=false;keys.nitro=false;
  }
 }else if(player.position.z< -safeEdge){
  player.position.z=-safeEdge;
  if(speed*Math.cos(heading)<0){
   const inwardHeading=Math.atan2(Math.sin(heading),Math.max(.12,Math.abs(Math.cos(heading))));
   heading+=angleDifference(inwardHeading,heading)*Math.min(1,dt*2.2);
   speed*=Math.exp(-.16*dt);
   steeringInput*=Math.exp(-1.8*dt);
   nitroActive=false;keys.nitro=false;
  }
 }

 // Mode sirkuit kota: uji akselerasi tetap aktif, AI masih nonaktif.
}

function updateAI(dt){
 return; // Mode tes lurus tanpa lawan AI.
 for(let i=0;i<ai.length;i++){
  const a=ai[i];
  if(a.finished)continue;

  let desired=[-3,0,3][i];

  // AI berusaha menghindari mobil lain.
  for(let j=0;j<ai.length;j++){
   if(i===j)continue;
   const other=ai[j];
   const gap=other.progress-a.progress;

   if(gap>.005&&gap<.10){
    desired=a.lane>=0?-4:4;
   }
  }

  const playerGap=playerProgress-a.progress;
  if(playerGap>-.015&&playerGap<.075){
   desired=a.lane>=0?-4:4;
  }

  a.targetLane=desired;
  a.lane=THREE.MathUtils.damp(a.lane,a.targetLane,1.8,dt);

  a.progress+=a.speed*dt;
  placeCar(a.car,a.progress,a.lane);
  a.car.userData.wheels.forEach(w=>w.wheel.rotation.x+=a.speed*dt*35);

  if(a.progress>=FINISH_PROGRESS){
   a.progress=FINISH_PROGRESS;
   a.finished=true;
   if(!raceOver)finishRace(a.name);
  }
 }
}

function handleCarCollisions(dt){
 // Tabrakan sederhana: mobil pemain terdorong dan kehilangan sebagian kecepatan.
 collisionCooldown=Math.max(0,collisionCooldown-dt);
 for(const a of ai){
  const dx=player.position.x-a.car.position.x;
  const dz=player.position.z-a.car.position.z;
  const distance=Math.sqrt(dx*dx+dz*dz);
  if(distance<2.65){
   if(distance>0.001){
    const push=(2.65-distance)*0.55;
    player.position.x+=(dx/distance)*push;
    player.position.z+=(dz/distance)*push;
   }
   if(collisionCooldown<=0){
    speed*=0.62;
    collisionCooldown=0.7;
   }
  }
 }
}

function update(dt){
 if(!running)return;
 elapsed+=dt;
 updatePlayer(dt);
 if(!raceOver)updateAI(dt);
 if(!raceOver)handleCarCollisions(dt);
 updateHUD();
}

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 updateSound(dt);

 const cameraDistance=5.15;
 const behind=new THREE.Vector3(
  -Math.sin(heading)*cameraDistance,
  2.65,
  -Math.cos(heading)*cameraDistance
 );
 const target=player.position.clone().add(behind);
 // Kembalikan kamera ke jarak semula dan ikuti mobil langsung tanpa tertinggal.
 camera.position.copy(target);
 camera.fov=68;
 camera.updateProjectionMatrix();
 camera.lookAt(player.position.x,player.position.y+.92,player.position.z);
 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
